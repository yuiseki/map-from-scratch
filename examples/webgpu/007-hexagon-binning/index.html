<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebGPU リアルタイム 3D ヘクスビン集計 (UK 交通事故) | map from scratch</title>
<style>
  :root { color-scheme: dark; font: 14px/1.45 system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0e1620; color: #f0f6f8; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #panel { position: fixed; top: 14px; left: 14px; max-width: min(430px, calc(100vw - 28px)); padding: 15px; border-radius: 13px; border: 1px solid #ffffff30; background: #10212de6; backdrop-filter: blur(10px); box-shadow: 0 12px 32px #0007; }
  h1 { margin: 0 0 4px; font-size: 19px; }
  p { margin: 0 0 8px; color: #c0d0d8; font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 8px 0; }
  button { padding: 5px 9px; border: 1px solid #87abb461; border-radius: 7px; background: #294756; color: inherit; font: inherit; cursor: pointer; transition: background 0.15s; }
  button:hover, button:focus-visible { background: #416674; }
  label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0; color: #c0d0d8; font-size: 13px; }
  input[type="range"] { flex: 1; accent-color: #70c5bc; }
  .val { width: 55px; text-align: right; font-variant-numeric: tabular-nums; }
  #ramp { width: 100%; height: 10px; border-radius: 5px; margin: 8px 0 3px; background: linear-gradient(to right, #1a3366, #1f808c, #33bf66, #e6d933, #f2731a, #e61a40); }
  .ramp-labels { display: flex; justify-content: space-between; font-size: 11px; color: #9bb0be; margin-bottom: 6px; }
  #detail, #status { color: #bfd2dc; font-variant-numeric: tabular-nums; font-size: 12px; }
  #detail { margin-top: 6px; padding-top: 6px; border-top: 1px solid #ffffff20; }
  #status { margin-top: 4px; overflow-wrap: anywhere; }
  #credit { position: fixed; right: 12px; bottom: 10px; max-width: min(620px, calc(100vw - 24px)); padding: 6px 9px; border-radius: 6px; background: #0b1722e8; font-size: 11px; }
  a { color: #a9e0da; }
  @media(max-width:600px) { #panel { top: 8px; left: 8px; padding: 11px; max-width: calc(100vw - 16px); } }
</style>
<canvas id="map" aria-label="英国交通事故14万件をWebGPU Computeで六角形集計し立体表示"></canvas>
<section id="panel">
  <h1>GPU 3D ヘクスビン集計</h1>
  <p>英国の交通事故 140,029 件を WebGPU Compute でリアルタイムに六角形集計します。</p>
  <div class="row" aria-label="視点プリセット">
    <button data-place="uk">英国全土</button>
    <button data-place="london">ロンドン</button>
    <button data-place="manchester">マンチェスター</button>
    <button data-place="birmingham">バーミンガム</button>
  </div>
  <label for="radius">集計半径 <input id="radius" type="range" min="400" max="3000" value="1000" step="50"><span id="radius-val" class="val">1,000m</span></label>
  <label for="elevation">高さ倍率 <input id="elevation" type="range" min="0.2" max="3.0" value="1.0" step="0.1"><span id="elevation-val" class="val">1.0×</span></label>
  <label for="coverage">列の幅 (隙間) <input id="coverage" type="range" min="0.5" max="1.0" value="0.88" step="0.02"><span id="coverage-val" class="val">0.88</span></label>
  <label for="percentile">上位分位 <input id="percentile" type="range" min="60" max="100" value="90" step="1"><span id="percentile-val" class="val">90%</span></label>
  <div id="ramp"></div>
  <div class="ramp-labels"><span>少 (1件)</span><span>中</span><span>多 (上位分位上限)</span></div>
  <p style="font-size: 11px; margin: 4px 0;">ドラッグで回転、右ドラッグで移動、ホイールでズーム</p>
  <div id="detail"><strong>集計中…</strong></div>
  <div id="status" role="status">データを読み込み中…</div>
</section>
<div id="credit">データ: <a href="https://www.data.gov.uk/dataset/cb7ae6f0-4be6-4935-9277-47e5ce24a11f/road-accidents-safety-data">UK Road Safety Data</a> (OGL) / <a href="https://deck.gl/examples/hexagon-layer">deck.gl HexagonLayer</a></div>
<script type="module" src="./main.ts"></script>
