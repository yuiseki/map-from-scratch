id: webgpu-004-osm-node-density
request: >-
  東京23区の OSM の全ノード（約 966 万点）の密度をヒートマップで見たい。拡大・移動したら、タイルの粗い集計ではなく、
  その画面の解像度で数え直してほしい。PC のブラウザで。
  （04-osm-node-density と同じ依頼を WebGPU の compute で数え、同じ条件で比べる）

requirements:
  - id: recount-per-view
    need: その画面の解像度で数え直す
    unmeasured: 正しさの要件なので verification.checks の count-conservation と counts-match-cpu で確かめる
  - id: smooth-navigation
    need: 拡大・移動が滑らか
    rationale: 04 と同じ。120 Hz の 1 フレーム 8.3 ms。全体表示 (最悪の場合) も同じ基準にする
  - id: visible
    need: 密度が画面に出ている
    unmeasured: verification.checks の shibuya-not-empty と ramp-reaches-bright で確かめる
  - id: opens
    need: PC のブラウザで開ける
    rationale: 04 と同じ。966 万点を生のまま配るのは依頼の前提。ローカル配信で 2 秒以内に最初の絵

evaluation:
  budgets:
    - {metric: frame_ms, stat: p95, max: 8.3, unit: ms, requirement: smooth-navigation}
    - {metric: whole_frame_ms, stat: p95, max: 8.3, unit: ms, requirement: smooth-navigation}
    - {metric: first_frame_ms, stat: p50, max: 2000, unit: ms, requirement: opens}
    - {metric: data_gzip_bytes, max: 20000000, unit: B, requirement: opens}
    - {metric: code_gzip_bytes, max: 4000, unit: B, requirement: opens}
  gates: [エラーがない, ハードウェアの GPU で描いている, verification の check がすべて通る]

benchmarks:
  runtime: browser
  page: examples/webgpu/004-osm-node-density/index.html
  viewport: {width: 1280, height: 800, device_scale_factor: 1, mobile: false}
  cpu_throttle: 1
  # headless Chromium only offers WebGPU on SwiftShader. Compare with 04 run
  # as MFS_DISPLAY=xvfb bin/mfs bench 04-osm-node-density.
  display: xvfb
  iterations: 3
  scenarios:
    - id: first-frame
      what: ページの読み込み (38 MB の取得と差分の復元を含む) から、最初の描画の GPU 完了まで
      metrics: [first_frame_ms]
    - id: zoom-path
      what: 04 と同じ。23 区全体から渋谷駅周辺へ 256 倍までズームして戻る 300 フレーム
      metrics: [cpu_ms, frame_ms, gpu_ms]
    - id: whole-view
      what: 全体表示で止めた 60 フレーム。全点が画面内で、同じピクセルへの atomicAdd が最も競合する
      metrics: [whole_cpu_ms, whole_frame_ms, whole_gpu_ms]
    - id: street-view
      what: 256 倍で止めた 60 フレーム。ほぼ全点が範囲外
      metrics: [street_cpu_ms, street_frame_ms, street_gpu_ms]

datasets:
  bake: [node, examples/04-osm-node-density/bake.ts]
  sources:
    - id: osm-tokyo23
      origin: OpenStreetMap、東京 23 区の抽出、2026-08-31 時点 (9,659,934 ノード)。04-osm-node-density と同じファイルを読む
      license: ODbL (© OpenStreetMap contributors)
  outputs: [data/baked/04-osm-node-density/nodes.bin]
  preparation:
    - 04-osm-node-density の bake をそのまま使う (同じ nodes.bin)

performance_knowledge:
  - id: same-input-as-04
    finding: 比べる 2 つの差を数え方だけにするため、データ、点の並び (128 本のストライド)、カメラの式、色、画面の大きさ、経路を 04 と同じにした
    evidence: 2 枚のスクリーンショットの画素の平均差は 0.41 / 255 (注記の文字の違いを含む)
    applies_when: 描画 API を比べるとき
  - id: compute-beats-blend
    finding: 同じ点を同じ画面で数えると、compute の atomicAdd は加算ブレンドより GPU 時間が 4〜5 倍短い
    evidence: gpu_ms p50 は経路 0.19 ms (04 は 0.82)、全体表示 0.51 ms (2.64)、256 倍表示 0.19 ms (0.77)。RTX 3060、交互に 2 回ずつ測って同じ値
    applies_when: 大量の点を画素やビンごとに数えるとき
  - id: bandwidth-floor
    finding: 全点が範囲外でも全点を読むので、GPU 時間には点の量で決まる床がある
    evidence: 256 倍表示は点の並びによらず 0.19 ms。38.6 MB を約 200 GB/s で読んでいる (RTX 3060 のメモリ帯域は 360 GB/s)
    applies_when: 表示範囲によらず全点を走査する compute
  - id: order-matters-less-for-atomics
    finding: 同じピクセルへの競合は、加算ブレンドより atomicAdd のほうが点の並びに鈍い
    evidence: 全体表示の gpu_ms はストライド 1 で 0.96 ms、16 と 128 で 0.51、1024 で 0.63 ms (04 のブレンドは 1 で 11.7、128 で 2.6 ms)
    applies_when: 空間順に並んだ点を atomicAdd で数えるとき
  - id: completion-wait-floor
    finding: WebGPU で完了を JS が受け取るまでには、GPU の仕事と関係なく約 2.3 ms かかる。frame_ms は経路の p50 で WebGL2 (readPixels で待つ) より長くなる
    evidence: gpu_ms 0.19 ms に対して frame_ms 2.30 ms。04 は frame_ms 1.06 ms
    applies_when: 毎フレーム GPU の完了を待つ処理 (読み戻しや計測)
  - id: inexact-wgsl-math
    finding: WGSL は割り算の誤差と FMA を許すので、ピクセルの境目ぎりぎりの点は CPU と違うピクセルに入ることがある
    evidence: 6 倍の表示で 102 万ピクセル中 186 ピクセルが CPU の厳密な数え直しと違った。境目から 1e-3 px 以内の点はどちらに入ってもよいとすると全ピクセルが一致する
    applies_when: GPU の結果を CPU と画素単位で照合するとき

architecture_selection:
  chosen:
    platform: browser
    api: WebGPU (compute の atomicAdd と、ワークグループごとの atomicMax)
    language: TypeScript (ブラウザには型を除いた ES modules を配る。ビルドなし)
    gpu: hardware
    code: [examples/webgpu/004-osm-node-density/main.ts, examples/webgpu/004-osm-node-density/density.ts]
    dependencies: []
    why: 04 と同じ依頼を、加算ブレンドでなく compute で数えたときの速さを同じ条件で測る
  alternatives:
    - option: WebGL2 の加算ブレンド
      rejected_because: それが 04。この例は比べる相手として作る
  not_doing: [タイル, 事前集計, タグや種類での絞り込み, 地名, 背景地図, 点のクリック, WebGPU が無いブラウザへの代替表示]

verification:
  checks:
    - id: count-conservation
      what: 全体が見えているとき、ピクセルごとの数の合計が点の数に一致する
      how: 0.9 倍の表示で数え、カウントのバッファを読み戻して合計する
      expected: 9,658,062
    - id: counts-match-cpu
      what: ピクセルごとの数が、同じ点を CPU で同じ規則 (f32 の演算) で数えた値と一致する。点を落として別の場所に作っても合計は変わらないので、合計の検査だけでは足りない
      how: 0.9 倍の全体表示と、渋谷駅を中心にした 6 倍で数え、カウントのバッファと CPU の数え直しを比べる。ピクセルの境目から 1e-3 px 以内の点はどちらに入ってもよい
      expected: 範囲外のピクセルが 0
    - id: shibuya-not-empty
      what: 画面に出た色で、渋谷駅の位置が「点なし」の色でない
      how: 同じ画面を描き、キャンバスの全ピクセルを読み戻して中央を見る
      expected: 背景色 (8,8,15) 以外
    - id: ramp-reaches-bright
      what: 色の段階のいちばん明るい色まで画面に出ている
      how: 同じ画面の全ピクセルの G の最大値を見る
      expected: G ≥ 200
  harness:
    - WebGPU のデバイスが失われたらエラーにする
    - info.gpu がソフトウェア描画ならエラーにする
