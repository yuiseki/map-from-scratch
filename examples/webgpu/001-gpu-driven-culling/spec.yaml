id: webgpu-001-gpu-driven-culling
request: >-
  PLATEAU 東京駅周辺 3,992 棟の 3D 建築物モデルに対し、WebGPU の Compute Shader で視錐台カリングを行い、
  生存した建物を drawIndexedIndirect で一括描画する GPU-driven レンダラーを作りたい。
  CPU 側からの個別 draw call 発行とカリング判定を完全に剥がし、ドラッグで視点周回できるようにする。

requirements:
  - id: light-footprint
    need: 外部依存ゼロで配布サイズを最小限に抑える
    rationale: Three.js や Babylon.js 等の巨大 3D エンジンを使わず、生の WebGPU API のみで実装
  - id: quick-start
    need: ページを開いて即座に 3D 都市が現れる
    rationale: 初期化ラグなしで 300 ms 以内に表示
  - id: smooth-interaction
    need: ドラッグによるオービット回転操作が 60 fps で滑らかに追従する
    rationale: 60 Hz の1フレームは 16.7 ms。再描画を 3.0 ms 以下に
  - id: gpu-driven-culling
    need: 視錐台判定と描画引数決定がすべて GPU 上の Compute Shader と Indirect Buffer で完結する
    unmeasured: verification checks で生存インスタンス数と画面描画を検証

evaluation:
  budgets:
    - {metric: code_gzip_bytes, max: 7100, unit: B, requirement: light-footprint}  # 7000 から変更: 実測の高さを読む処理と canvas を表示サイズに合わせる処理で 7,029 B
    - {metric: data_gzip_bytes, max: 45000, unit: B, requirement: light-footprint}
    - {metric: first_frame_ms, stat: p50, max: 1200, unit: ms, requirement: quick-start}
    - {metric: cpu_ms, stat: p95, max: 3.0, unit: ms, requirement: smooth-interaction}
    - {metric: frame_ms, stat: p95, max: 16.7, unit: ms, requirement: smooth-interaction}
  gates: [エラーがない, ハードウェアの GPU で描いている, verification の check がすべて通る]

benchmarks:
  runtime: browser
  page: examples/webgpu/001-gpu-driven-culling/index.html
  viewport: {width: 1024, height: 768, device_scale_factor: 1, mobile: false}
  cpu_throttle: 1
  # headless Chromium only offers WebGPU on SwiftShader
  display: xvfb
  iterations: 3
  scenarios:
    - id: first-frame
      what: 建物バイナリデータの取得から初回 WebGPU 描画まで
      metrics: [first_frame_ms]
    - id: orbit
      what: 60 フレームの視点回転。1 フレームはカリングの compute パスと描画パスで、オフスクリーンに描く。JS の時間 (cpu_ms)、onSubmittedWorkDone までの時間 (frame_ms)、timestamp で測ったカリングの開始から描画の終わりまで (gpu_ms)
      metrics: [cpu_ms, frame_ms, gpu_ms]

datasets:
  bake: [node, examples/webgpu/001-gpu-driven-culling/bake.ts]
  sources:
    - id: plateau-tokyo-2km
      origin: Project PLATEAU 3D 都市モデル（東京都千代田区・中央区）
      license: 政府標準利用規約 2.0 (PDL 1.0)
  outputs:
    - data/baked/webgpu-001-gpu-driven-culling/buildings.bin
  preparation:
    - 16-plateau-buildings-3d の truth.json から各建物の lod0 footprint 上の点 [x, y] と footprint 面積を読む
    - 高さは 16 の配信アーカイブ（tokyo-station-2km.v1.plb）の建物メッシュをその点で鉛直に貫き、最上の交点から最下の交点を引いて測る（3,992 棟中 3,991 棟で交点あり、残り 1 棟は 4 m）
    - 1 棟 8 bytes（x, y, 高さ, 面積の平方根を一辺とする正方形の辺長、いずれも 0.1 m 単位の 16 bit 整数）。外接球半径と階層分類はページで計算する
    - 単位直方体プロトタイプメッシュ（法線付き 24 頂点・36 索引）を同梱

performance_knowledge:
  - id: gpu-driven-culling-indirect
    finding: Compute Shader による視錐台カリングと drawIndexedIndirect() の組み合わせにより、CPU から地物ごとの描画判定と draw コールを完全に剥がし、数千棟の 3D 建築物を 0.5 ms 未満で一括描画できる
    evidence: RTX 3060 (Xvfb 上の Chromium) で、1 フレームの JS は p95 0.075 ms、timestamp で測った GPU 時間 (カリングの開始から描画の終わり) は p50 0.046 ms。frame_ms p95 2.4 ms は onSubmittedWorkDone の床
    applies_when: 大規模 3D 都市モデル・点群・インスタンス群のリアルタイム表示
  - id: swiftshader-is-not-the-gpu
    finding: headless の Chromium の WebGPU は SwiftShader なので、そこで測ったフレーム間隔は CPU の空きで決まり、GPU の例の速さを表さない。Xvfb 上の画面ありの Chromium でハードウェアの GPU を使い、オフスクリーンに描いて timestamp で測る
    evidence: SwiftShader の frame_interval_ms p95 は実行ごとに 17 ms 前後か 35〜44 ms (予算 35 ms をまたいだ)。RTX 3060 では frame_ms p95 2.4 ms、gpu_ms 0.046 ms
    applies_when: WebGPU の例を計測するとき
  - id: adapter-dominates-first-frame
    finding: 初回描画のほとんどは requestAdapter で、powerPreference を変えても縮まない。データの取得をその間に済ませる
    evidence: requestAdapter 660〜690 ms、requestDevice 80 ms、データ取得とパイプライン作成で 6 ms。first_frame_ms p50 641〜763 ms
    applies_when: WebGPU のページの立ち上げを速くしたいとき

architecture_selection:
  chosen:
    platform: browser
    api: WebGPU
    language: TypeScript (型ストリップ配信)
    gpu: hardware
    code:
      - examples/webgpu/001-gpu-driven-culling/index.html
      - examples/webgpu/001-gpu-driven-culling/main.ts
      - examples/webgpu/001-gpu-driven-culling/map.ts
    dependencies: []
    why: WGSL Compute Shader と Indirect Buffer による完全な GPU-driven レンダリングパイプラインの実現
  alternatives:
    - option: CPU Frustum Culling + WebGL2 Instancing
      rejected_because: 毎フレーム CPU で数千回の行列計算とバウンディングボックステストが発生し、CPU-GPU 転送がボトルネックになる
  not_doing: [LOD3/4 テクスチャマッピング, 地名ラベル, 影の深度マップレンダリング]

verification:
  checks:
    - id: heights-from-plateau
      what: 高さと footprint がデータ由来である（最も高い建物が 16 の最高層ビルで、面積の合計が 16 の footprint 面積の合計に一致する）
      how: buildings.bin と 16 の truth.json を読み、最も高いインスタンスの位置と高さ、辺長の二乗の合計を照合
      expected: '最高層ビルから 60 m 以内、高さ maxz−15 m 以上 maxz 以下、面積合計の差 1% 未満'
    - id: buildings-loaded
      what: 東京駅周辺の建物 3,992 棟がすべてロードされる
      how: map.buildingCount を検証
      expected: 3992
    - id: gpu-compute-culling
      what: 視錐台の外部にある建物が GPU 上で自動的にカリングされ、生存インスタンス数が全数より少なくなる
      how: GPU indirectBuffer から読み戻した instanceCount を検証
      expected: 0 < visibleCount < 3992
    - id: buildings-rendered
      what: 画面中央部に陰影のついた 3D 建築物が描画されている
      how: 画面中央付近のピクセル色を検証
      expected: 背景色と異なる建物色
    - id: camera-orbit-updates-count
      what: カメラ視点を回転したとき、GPU 上の生存インスタンス数が動的に変化する
      how: 回転前後の visibleCount を検証
      expected: 回転前後で count が更新される
  harness:
    - contextlost が起きたらエラーにする
