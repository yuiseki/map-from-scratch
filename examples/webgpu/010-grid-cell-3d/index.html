<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>パリ街路樹密度 3D グリッド (WebGPU) | map from scratch</title>
<style>
  :root { color-scheme: dark; font: 14px/1.45 system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #060b11; color: #f0f6f8; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #panel { position: fixed; top: 14px; left: 14px; max-width: min(425px, calc(100vw - 28px)); padding: 15px; border-radius: 13px; border: 1px solid #ffffff30; background: #0a1622e8; backdrop-filter: blur(10px); box-shadow: 0 12px 32px #0008; }
  h1 { margin: 0 0 4px; font-size: 19px; }
  p { margin: 0 0 8px; color: #c0d0d8; font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 8px 0; }
  button { padding: 5px 10px; border: 1px solid #87abb461; border-radius: 7px; background: #1c3546; color: inherit; font: inherit; cursor: pointer; transition: background 0.15s; }
  button:hover, button:focus-visible { background: #2f536c; }
  button.active { background: #3ab578; color: #08151f; font-weight: 600; border-color: #3ab578; }
  label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0; color: #c0d0d8; font-size: 13px; }
  input[type="range"] { flex: 1; accent-color: #70c5bc; }
  .val { width: 45px; text-align: right; font-variant-numeric: tabular-nums; }
  .legend { display: flex; align-items: center; gap: 8px; margin: 8px 0; font-size: 11px; }
  .ramp { flex: 1; height: 10px; border-radius: 5px; background: linear-gradient(to right, #d7e354, #2bb673, #00a8cc, #49227d); }
  #detail, #status { color: #bfd2dc; font-variant-numeric: tabular-nums; font-size: 12px; }
  #detail { margin-top: 6px; padding-top: 6px; border-top: 1px solid #ffffff20; min-height: 2.5em; }
  #status { margin-top: 4px; overflow-wrap: anywhere; }
  #credit { position: fixed; right: 12px; bottom: 10px; max-width: min(620px, calc(100vw - 24px)); padding: 6px 9px; border-radius: 6px; background: #07101ae8; font-size: 11px; }
  a { color: #a9e0da; }
  @media(max-width:600px) { #panel { top: 8px; left: 8px; padding: 11px; max-width: calc(100vw - 16px); } }
</style>
<canvas id="map" aria-label="パリの街路樹密度をWebGPUで3D直方体グリッド柱表示"></canvas>
<section id="panel">
  <h1>パリ街路樹密度 3D グリッド (WebGPU)</h1>
  <p>20万本の街路樹密度を、直方体キューブ（GridCellLayer）の高さと色で立体可視化します。</p>
  <div class="row" aria-label="解像度切り替え">
    <span style="font-size:12px; color:#c0d0d8;">メッシュ解像度:</span>
    <button data-res="128">128m</button>
    <button data-res="256" class="active">256m</button>
    <button data-res="512">512m</button>
    <button data-res="1024">1024m</button>
  </div>
  <div class="row" aria-label="視点プリセット">
    <button data-place="overview">全景俯瞰</button>
    <button data-place="center">シテ島周辺</button>
    <button data-place="bois">ブローニュの森</button>
  </div>
  <label for="elevation">高さ倍率 <input id="elevation" type="range" min="0.2" max="3.0" value="1.0" step="0.1"><span id="elevation-val" class="val">1.0×</span></label>
  <label for="coverage">カバレッジ <input id="coverage" type="range" min="0.5" max="1.0" value="0.88" step="0.02"><span id="coverage-val" class="val">88%</span></label>
  <div class="legend"><span>低密度</span><div class="ramp"></div><span>高密度</span></div>
  <p style="font-size: 11px; margin: 4px 0;">ドラッグで回転、右ドラッグで移動、ホイールでズーム</p>
  <div id="detail"><strong>グリッドを読み込み中…</strong></div>
  <div id="status" role="status">準備中…</div>
</section>
<div id="credit">データ: <a href="https://opendata.paris.fr/explore/dataset/les-arbres/">Ville de Paris Open Data (Les arbres)</a> / <a href="https://deck.gl/examples/grid-layer">deck.gl GridLayer</a></div>
<script type="module" src="./main.ts"></script>
