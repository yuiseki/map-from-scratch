<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マンハッタン タクシー軌跡 3D (WebGPU) | map from scratch</title>
<style>
  :root { color-scheme: dark; font: 14px/1.45 system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #070d14; color: #f0f6f8; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #panel { position: fixed; top: 14px; left: 14px; max-width: min(425px, calc(100vw - 28px)); padding: 15px; border-radius: 13px; border: 1px solid #ffffff30; background: #0b1522e8; backdrop-filter: blur(10px); box-shadow: 0 12px 32px #0008; }
  h1 { margin: 0 0 4px; font-size: 19px; }
  p { margin: 0 0 8px; color: #c0d0d8; font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 8px 0; }
  button { padding: 5px 10px; border: 1px solid #87abb461; border-radius: 7px; background: #1f3748; color: inherit; font: inherit; cursor: pointer; transition: background 0.15s; }
  button:hover, button:focus-visible { background: #325870; }
  label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0; color: #c0d0d8; font-size: 13px; }
  input[type="range"] { flex: 1; accent-color: #70c5bc; }
  .val { width: 50px; text-align: right; font-variant-numeric: tabular-nums; }
  .legend { display: flex; gap: 14px; margin: 8px 0; font-size: 12px; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .yellow { background: #ffb826; box-shadow: 0 0 8px #ffb826; }
  .green { background: #26f2a6; box-shadow: 0 0 8px #26f2a6; }
  #detail, #status { color: #bfd2dc; font-variant-numeric: tabular-nums; font-size: 12px; }
  #detail { margin-top: 6px; padding-top: 6px; border-top: 1px solid #ffffff20; }
  #status { margin-top: 4px; overflow-wrap: anywhere; }
  #credit { position: fixed; right: 12px; bottom: 10px; max-width: min(620px, calc(100vw - 24px)); padding: 6px 9px; border-radius: 6px; background: #07101ae8; font-size: 11px; }
  a { color: #a9e0da; }
  @media(max-width:600px) { #panel { top: 8px; left: 8px; padding: 11px; max-width: calc(100vw - 16px); } }
</style>
<canvas id="map" aria-label="マンハッタンのタクシー軌跡と建物をWebGPUで3D立体再生"></canvas>
<section id="panel">
  <h1>NYC タクシー軌跡 3D (WebGPU)</h1>
  <p>マンハッタンの 3D 建築物の間を疾走するタクシーの軌跡をリアルタイム再生します。</p>
  <div class="row" aria-label="再生コントロール">
    <button id="play-btn">一時停止</button>
    <button data-place="midtown">ミッドタウン</button>
    <button data-place="downtown">金融街</button>
    <button data-place="overview">マンハッタン全体</button>
  </div>
  <label for="time">再生時刻 <input id="time" type="range" min="0" max="1800" value="900" step="1"><span id="time-val" class="val">15:00</span></label>
  <label for="trail">軌跡の長さ <input id="trail" type="range" min="30" max="300" value="180" step="10"><span id="trail-val" class="val">180秒</span></label>
  <label for="width">軌跡の太さ <input id="width" type="range" min="1.0" max="4.5" value="2.2" step="0.2"><span id="width-val" class="val">2.2px</span></label>
  <div class="legend">
    <div class="legend-item"><span class="dot yellow"></span><span>イエローキャブ</span></div>
    <div class="legend-item"><span class="dot green"></span><span>グリーンキャブ</span></div>
  </div>
  <p style="font-size: 11px; margin: 4px 0;">ドラッグで回転、右ドラッグで移動、ホイールでズーム</p>
  <div id="detail"><strong>再生中</strong></div>
  <div id="status" role="status">軌跡データを読み込み中…</div>
</section>
<div id="credit">データ: <a href="https://github.com/visgl/deck.gl-data/tree/master/examples/trips">NYC Taxi and Limousine Commission</a> / <a href="https://deck.gl/examples/trips-layer">deck.gl TripsLayer</a></div>
<script type="module" src="./main.ts"></script>
