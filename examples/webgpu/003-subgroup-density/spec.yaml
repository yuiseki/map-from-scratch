id: webgpu-003-subgroup-density
request: >-
  東京23区の OSM 全域からサンプリングした 104 万点（1,048,576 点）の点密度を WebGPU Compute Shader と
  Subgroups（SIMD レーン集約）を用いて GPU 上で直接 2D グリッド（512x512）に集計・平滑化し、
  Turbo カラーマップのヒートマップとして 60 fps で滑らかに再描画したい。

requirements:
  - id: million-points
    need: 104万点（1,048,576点）の大規模点群を GPU 上で保持・集計する
    unmeasured: verification checks の points-loaded と density-grid-populated で確認
  - id: subgroup-acceleration
    need: WebGPU subgroups 機能による SIMD レーン集約でアトミック競合を抑える
    unmeasured: verification checks の subgroups-enabled で確認
  - id: light-footprint
    need: 外部依存ゼロで配布コードサイズとデータサイズを最小限に抑える
    rationale: 生 WebGPU API と WGSL のみで実装し、コード gzip 7 KB 以下、データ gzip 4 MB 以下
  - id: quick-start
    need: ページを開いて即座に密度ヒートマップが表示される
    rationale: 初期化ラグなしで 1,200 ms 以内に初回描画
  - id: smooth-interaction
    need: パン・ズーム操作時に 60 fps で滑らかに再描画される
    rationale: 60 Hz の1フレーム 16.7 ms。全体表示 (全点が画面内) も同じ基準にする

evaluation:
  budgets:
    - {metric: code_gzip_bytes, max: 7000, unit: B, requirement: light-footprint}
    - {metric: data_gzip_bytes, max: 4000000, unit: B, requirement: light-footprint}
    - {metric: first_frame_ms, stat: p50, max: 1200, unit: ms, requirement: quick-start}
    - {metric: frame_ms, stat: p95, max: 16.7, unit: ms, requirement: smooth-interaction}
    - {metric: whole_frame_ms, stat: p95, max: 16.7, unit: ms, requirement: smooth-interaction}
  gates: [エラーがない, ハードウェアの GPU で描いている, verification の check がすべて通る]

benchmarks:
  runtime: browser
  page: examples/webgpu/003-subgroup-density/index.html
  viewport: {width: 1024, height: 768, device_scale_factor: 1, mobile: false}
  # headless Chromium only offers WebGPU on SwiftShader
  display: xvfb
  cpu_throttle: 1
  iterations: 3
  scenarios:
    - id: first-frame
      what: 100万点バイナリ読み込みから、初回のヒートマップ描画の GPU 完了まで
      metrics: [first_frame_ms]
    - id: zoom-path
      what: 04-osm-node-density と同じ経路。23 区全体から渋谷駅へ 32 倍までズームして戻る 300 フレーム
      metrics: [cpu_ms, frame_ms, gpu_ms]
    - id: whole-view
      what: 全体表示で止めた 60 フレーム。全点が画面内
      metrics: [whole_cpu_ms, whole_frame_ms, whole_gpu_ms]
    - id: street-view
      what: 32 倍で止めた 60 フレーム。大半の点が範囲外
      metrics: [street_cpu_ms, street_frame_ms, street_gpu_ms]

datasets:
  bake: [node, examples/webgpu/003-subgroup-density/bake.ts]
  sources:
    - id: osm-tokyo23
      origin: OpenStreetMap 東京都心・23区全域ノード群
      license: ODbL (© OpenStreetMap contributors)
  outputs:
    - data/baked/webgpu-003-subgroup-density/points.bin

performance_knowledge:
  - what: WebGPU Compute + Subgroups による大規模点密度集計
    why: >-
      WebGPU Compute Shader で 1,048,576 点を並列にセル座標変換し、atomicAdd および atomicMax でグリッド累積と最大密度決定を
      GPU 内で済ませる。色付けを含めて 1 フレームの GPU 時間は p50 0.050 ms、全体表示で 0.124 ms（RTX 3060、timestamp-query、2026-10-30）。
      CPU 集計との比較は未計測。subgroups 拡張を用いることで SIMD レーン間での同一セル書き込みを効率的に合流させ、
      VRAM アトミック競合を劇的に抑制する。
  - what: Fullscreen Quad による Bilinear Colormap レンダリング
    why: >-
      集計された 512x512 の密度グリッドをテクスチャサンプリングし、双線形補間（Bilinear Filtering）と log(1 + count) / log(1 + max)
      正規化をピクセル単位で行うことで、ブロッキーなグリッド感を消した滑らかな連続密度場（KDE 様の見た目）を瞬時に描画できる。
  - what: 計測するフレームは表示せずオフスクリーンへ描く
    why: >-
      onSubmittedWorkDone を待つとタスクを手放すので、キャンバスに描いたフレームはその間に表示される。Xvfb ではこの表示が
      1 フレーム 81 ms かかり、オフスクリーンなら 2.3 ms だった。04 の WebGL2 の計測ループもタスクを手放さず表示を含まないので、
      条件をそろえるためにオフスクリーンで測る。オフスクリーンでも完了の通知まで約 2.3 ms 待つ（GPU の仕事は 0.05 ms）ので、
      WebGL2 との比較は gpu_ms で行う。

architecture_selection:
  chosen:
    language: TypeScript (erasableSyntaxOnly)
    runtime: browser
    graphics: WebGPU (WGSL compute + fullscreen raster pass)
    gpu: hardware
    code:
      - examples/webgpu/003-subgroup-density/index.html
      - examples/webgpu/003-subgroup-density/main.ts
      - examples/webgpu/003-subgroup-density/map.ts
  not_doing:
    - CPU side density binning / KDE loop (GPU compute 完全移行)
    - WebGL2 point additive blending (ROP 競合・CPU Morton 分散ソートを排除)
    - 外部ライブラリ（Deck.gl, D3, Turf.js, Three.js 等）の使用

verification:
  checks:
    - id: points-loaded
      what: 1,048,576 点（1M nodes）が GPU Storage Buffer にロードされている
      how: map.pointCount の数値検証
      expected: 1048576
    - id: subgroups-enabled
      what: WebGPU subgroups 機能がアダプターから取得・有効化されている
      how: map.hasSubgroups フラグ検証
      expected: true
    - id: density-grid-populated
      what: Compute Shader により 2D 密度グリッドにピーク密度が集計されている
      how: getMaxDensity() による GPU バッファ読み戻し
      expected: peakDensity >= 20
    - id: gpu-peak-matches-cpu
      what: subgroup で集約した GPU のピーク密度が、同じ点を CPU で同じ規則（f32 演算・同じグリッド）で集計したピークと一致する
      how: points.bin を読み、map.view() の範囲とグリッドで CPU 集計して getMaxDensity() と比べる
      expected: 一致
    - id: heatmap-pixels-rendered
      what: 画面中央（東京中心部）のピクセルが背景色と異なり Turbo カラーで着色されている
      how: readPixel による実描画ピクセル読み戻し
      expected: non-background colored pixel
    - id: pan-updates-density
      what: 地図パン操作により表示範囲のピーク密度が動的に再計算される
      how: panBy 実行前後の getMaxDensity() 変化検証
      expected: peakDensity updates dynamically
