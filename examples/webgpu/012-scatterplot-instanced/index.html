<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebGPU Instanced Scatterplot Layer (Manhattan)</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d141f;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    #ui {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(13, 20, 31, 0.85);
      backdrop-filter: blur(8px);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      max-width: 320px;
      font-size: 13px;
      line-height: 1.5;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 8px 0;
      color: #fff;
      font-weight: 600;
    }
    .row {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      align-items: center;
    }
    label {
      color: #aaa;
    }
    input[type=range] {
      width: 140px;
    }
    .legend {
      display: flex;
      gap: 12px;
      margin-top: 8px;
      font-size: 11px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    #status {
      margin-top: 10px;
      font-size: 11px;
      color: #88c0d0;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <h1>WebGPU Instanced Scatterplot</h1>
    <div style="color: #888; font-size: 12px; margin-bottom: 8px;">13,987 Manhattan Points</div>
    <div class="legend">
      <div class="legend-item">
        <span class="dot" style="background: #1f87e6;"></span>
        <span>Weight 1 (Blue)</span>
      </div>
      <div class="legend-item">
        <span class="dot" style="background: #ffb340;"></span>
        <span>Weight 2 (Amber)</span>
      </div>
    </div>
    <div class="row" style="margin-top: 10px;">
      <label for="radius-scale">Radius Scale:</label>
      <input type="range" id="radius-scale" min="0.5" max="3.0" step="0.1" value="1.0" />
    </div>
    <div class="row">
      <span>Points:</span>
      <span id="point-count" style="font-weight: bold; color: #4fc3f7;">0</span>
    </div>
    <div id="status">Initializing WebGPU...</div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
