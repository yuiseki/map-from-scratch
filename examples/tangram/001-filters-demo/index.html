<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tangram: Filtering data</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #b8d6e8; font-family: system-ui, sans-serif; }
    #map { width: 100%; height: 100%; display: block; cursor: grab; }
    #map:active { cursor: grabbing; }
    .panel {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(255, 255, 255, 0.94);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 10;
    }
    .panel b { color: #1f3a52; font-size: 14px; }
    .panel label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .swatch { width: 14px; height: 4px; border-radius: 2px; display: inline-block; }
  </style>
</head>
<body>
  <canvas id="map"></canvas>
  <div class="panel">
    <div><b>Tangram 001</b>: filtering highways by class</div>
    <label><input type="checkbox" data-type="SR" checked><span class="swatch" style="background:#ff7f2a"></span>State routes</label>
    <label><input type="checkbox" data-type="US" checked><span class="swatch" style="background:#2e9e5b"></span>US highways</label>
    <label><input type="checkbox" data-type="I" checked><span class="swatch" style="background:#3b6fd4"></span>Interstates</label>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
