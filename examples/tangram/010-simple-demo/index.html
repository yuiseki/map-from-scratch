<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tangram: Simple Demo</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #161a22; font-family: system-ui, sans-serif; }
    #map { width: 100%; height: 100%; display: block; cursor: grab; }
    #map:active { cursor: grabbing; }
    .panel {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(22, 26, 34, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 10;
    }
    .panel b { color: #88c0d0; font-size: 14px; }
  </style>
</head>
<body>
  <canvas id="map"></canvas>
  <div class="panel">
    <div><b>Tangram 010</b>: Simple Demo</div>
    <div style="font-size: 12px; color: #a0aec0;">High-contrast vector cartography styling</div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
