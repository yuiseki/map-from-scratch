<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tangram: Highways Demo (Zoom-dependent Styling)</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #151922; font-family: system-ui, sans-serif; }
    #map { width: 100%; height: 100%; display: block; cursor: grab; }
    #map:active { cursor: grabbing; }
    .panel {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(21, 25, 34, 0.92);
      border: 1px solid rgba(0, 229, 255, 0.3);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      color: #e0e6ed;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 10;
    }
    .panel b { color: #00e5ff; font-size: 14px; }
    .legend {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #9ab0c5;
    }
    .line-indicator {
      width: 24px;
      height: 3px;
      background: #00e5ff;
      box-shadow: 0 0 6px #00e5ff;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <canvas id="map"></canvas>
  <div class="panel">
    <div><b>Tangram 004</b>: Highways Demo</div>
    <div class="legend">
      <span class="line-indicator"></span>
      <span>Bay Area Highway Network</span>
    </div>
    <div style="font-size: 11px; color: #6a7c92;">Zoom in/out to see dynamic line width scaling</div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
