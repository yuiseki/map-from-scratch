<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tangram: Terrain Light Demo</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #8fa3bf; color: #e6e8ee; font: 13px/1.45 system-ui, sans-serif; }
    #map { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
    #map:active { cursor: grabbing; }
    .panel { position: absolute; top: 12px; left: 12px; max-width: min(340px, calc(100% - 48px)); background: rgba(13, 15, 20, 0.86); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 8px; padding: 10px 12px; display: grid; gap: 7px; }
    .panel b { font-size: 14px; }
    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    button { font: inherit; color: inherit; background: #262b36; border: 1px solid #4a5163; border-radius: 6px; padding: 3px 10px; cursor: pointer; }
    button[aria-pressed="true"] { background: #a8632a; border-color: #e0a060; }
    #readout { color: #f3d9a4; font-variant-numeric: tabular-nums; }
    .hint { color: #a3aab8; font-size: 12px; }
    #attr { position: absolute; right: 0; bottom: 0; max-width: calc(100% - 16px); background: rgba(13, 15, 20, 0.8); color: #c3c8d2; font-size: 11px; padding: 3px 8px; border-top-left-radius: 6px; }
    #attr a { color: #9cc3ff; }
  </style>
</head>
<body>
  <canvas id="map"></canvas>
  <div class="panel">
    <div><b>Tangram 014</b>: Terrain Light（富士山と富士五湖）</div>
    <div class="row"><button id="sun" aria-pressed="false">太陽を動かす</button><label><input id="shadows" type="checkbox" checked> 影</label></div>
    <div class="row"><label for="exag">高さの誇張</label><input id="exag" type="range" min="1" max="3" step="0.1" value="2"><span id="exagv">2.0x</span></div>
    <div id="readout"></div>
    <div class="hint">色は標高の段彩（緑 低地、茶 2,300 m から、白 3,300 m より上）。</div>
    <div class="hint">マウスを動かすと光が動く（中心ほど高く、端ほど低い）。ドラッグで回転、ホイールで拡大縮小。</div>
  </div>
  <div id="attr">標高 © <a href="https://mapterhorn.com/attribution/">Mapterhorn</a>（<a href="https://service.gsi.go.jp/kiban/app/">国土地理院 基盤地図情報 数値標高モデル</a>を含むデータを加工。測量法に基づく国土地理院長承認（使用）R 8JHs 131）｜湖 © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
