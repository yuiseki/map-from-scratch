id: cesium-244-points
request: >-
  CesiumJS Sandcastle の「Points」のように、3D 地球儀上に 5,000 個の点プリミティブを配置し、
  視線に応じた地平線オクルージョン判定（裏面カリング）とカラーバッチ描画により 60 fps で高速に回転・ズーム表示したい。
  ドラッグで回転、ホイールで拡大縮小できること。外部ライブラリなし、Canvas 2D で最速・最小で実装する。

requirements:
  - id: light-footprint
    need: 外部依存ゼロで配布サイズを最小限に抑える
    rationale: 5,000 点の 3D プリミティブ表示に CesiumJS エンジン全体の読み込みは不要
  - id: quick-start
    need: ページを開いて即座に 3D 地球儀と点群が現れる
    rationale: 初期化ラグなしで 300 ms 以内に表示
  - id: smooth-interaction
    need: ドラッグによる回転や拡大縮小が 60 fps で滑らかに追従する
    rationale: 60 Hz の1フレームは 16.7 ms
  - id: horizon-culling
    need: 地球の前面にある点のみが描画され、地平線の裏側に回った点は正確に遮蔽・カリングされる
    unmeasured: verification の checks で回転前後のピクセル色と遮蔽を検証

evaluation:
  budgets:
    - {metric: code_gzip_bytes, max: 3750, unit: B, requirement: light-footprint}  # 3500 から変更: 地平線の分割処理で 3,680 B。3700 から変更 (2026-11-06): テストのために toSphere を triangleVerticesOnSphere として export し (34f9c64)、3,699 B が 3,701 B になった
    - {metric: data_gzip_bytes, max: 70000, unit: B, requirement: light-footprint}
    - {metric: first_frame_ms, stat: p50, max: 300, unit: ms, requirement: quick-start}
    - {metric: redraw_ms, stat: p95, max: 2.5, unit: ms, requirement: smooth-interaction}  # 2.0 から変更 (2026-11-06): p95 は JIT が温まる前の最初の数フレームで決まり、load average 19〜22 のマシンでは Chrome 156 でも 157 でも 2.03〜2.28 ms (p50 0.9〜1.06 ms)。静かなときは 1.0〜1.6 ms。60 fps の 1 フレーム 16.7 ms の 15%
    - {metric: frame_interval_ms, stat: p95, max: 20, unit: ms, requirement: smooth-interaction}
  gates: [エラーがない, verification の check がすべて通る]

benchmarks:
  runtime: browser
  page: examples/cesium/244-points/index.html
  viewport: {width: 1024, height: 768, device_scale_factor: 1, mobile: false}
  cpu_throttle: 1
  iterations: 3
  scenarios:
    - id: first-frame
      what: 地球陸地および5,000点の取得から初回描画まで
      metrics: [first_frame_ms]
    - id: rotate
      what: 60フレームの地球儀回転操作中の再描画時間とフレーム間隔
      metrics: [redraw_ms, frame_interval_ms]

datasets:
  bake: [node, examples/cesium/244-points/bake.ts]
  sources:
    - id: ne-110m-land
      origin: https://github.com/nvkelso/natural-earth-vector/tree/master/geojson
      license: Natural Earth パブリックドメイン
  outputs:
    - data/baked/cesium-244-points/land.bin
    - data/baked/cesium-244-points/points.bin
  preparation:
    - Natural Earth 110m 陸地ポリゴンを球面緯経度座標で格納
    - 世界各地に均等分散する5,000点の位置・カラー種別（5種）・サイズをコンパクトなバイナリ（8バイト/点）としてベイク

performance_knowledge:
  - id: canvas2d-point-primitive-batching
    finding: 5,000 点を毎フレーム arc で描くと、円弧のパスを作る JS 時間がいちばん重い。点を長さ 0 の線分にして丸い線端 (lineCap round) で円にし、色と半径 (1/4 px 刻み) ごとの Path2D に入れて、縁取り (1.2 px 太い黒) と塗りの 2 回 stroke すると、点 1 つは moveTo と lineTo だけになる。単位球の xyz は読み込み時に 1 回だけ計算し、フレームでは回転だけする
    evidence: >-
      RTX 3060 のホストの headless Chromium (load average 3〜6、2026-11-03)。再描画 p95 は 2.4〜3.1 ms (予算 2 ms) だった。xyz の前計算で 1.8〜2.5 ms、
      このときの内訳 (p95) は陸 0.51 ms、点の投影 0.41 ms、円弧 1.60 ms。縁取りと塗りで同じ円弧のパスを使うと 1.7 ms、
      丸い線端の点にして 0.86〜1.6 ms、フレーム間隔 p95 は 1.2〜2.0 ms。画面の差は円の縁のアンチエイリアスだけ。
      点を前もって描いたスプライトの drawImage にすると、別々のキャンバスで 57 ms、1 枚のアトラス (ImageBitmap) でも 26〜33 ms と逆に遅くなった
    applies_when: Canvas 2D で数千個の小さな円を毎フレーム描くとき
  - id: cold-frames-set-the-p95
    finding: 60 フレームの p95 は上から 3 番目なので、JIT が温まる前の最初の数フレームで決まる。温まったあとは 0.6 ms でも、最初の 4 フレームが 2.1〜2.5 ms で予算を超えた。陸の頂点の回転を 1 本の平らなループに出し、点の色と大きさをオブジェクトでなく型付き配列で読むと、遅いのは最初の 1 フレームだけになる
    evidence: >-
      最初の数フレームの内訳は、陸の三角形 1.3〜3.1 ms (温まると 0.29 ms)、そのあと点 0.7〜1.5 ms (温まると 0.22 ms)。直したあとの再描画 p95 は 1.0〜1.45 ms、
      最初の 8 フレームは 2.3、1.0、1.1、0.9 ms ...。計測ループを画素の読み戻しより前に動かしても最初の数フレームは変わらなかったので、読み戻しは原因ではない
    applies_when: p95 の予算を、操作を始めた直後のフレームを含む短い計測で見るとき
  - id: split-triangles-at-the-horizon
    finding: 陸のリングを頂点ごとに投影し、地平線の裏の頂点を飛ばして部分パスを切る描き方では、見えている区間ごとに弦で閉じられて陸が直線で切り取られる（大陸が縁にかかると西ユーラシアとアフリカに暗い帯が出た）。穴のリングも別に塗られる。ベイク時に earcut の三角形にし、読み込み時に辺 20° 以下へ分割して単位球の xyz で持ち、地平線をまたぐ三角形は裏の頂点を縁へ寄せ、1 本のパスで塗ると消える（cesium 180・213 と同じ方式）
    evidence: 陸データは JSON のリング 39.0 KB から三角形 27.7 KB gzip に減った。M シリーズ Mac の Chrome で再描画 p95 は 3.92 ms から 2.91 ms、初回描画 p50 は約 92 ms。コードは 3,285 B から 3,680 B に増えた。実行時に earcut を配るとそれだけでコード予算を超える
    applies_when: Canvas 2D の地球儀で陸を塗るとき

architecture_selection:
  chosen:
    platform: browser
    api: Canvas 2D
    language: TypeScript (型ストリップ配信)
    gpu: none
    code:
      - examples/cesium/244-points/index.html
      - examples/cesium/244-points/main.ts
      - examples/cesium/244-points/globe.ts
    dependencies: []
    why: 3D 地球儀正射投影とカラー別バッチ点描画を Canvas 2D で最速・最小に実装
  alternatives:
    - option: CesiumJS フルスタック
      rejected_because: 数十 MB の WebGL エンジンとシェーダー初期化オーバーヘッドが過大
  not_doing: [3D地形メッシュ, 大気散乱シェーダー, リアルタイム衛星軌道シミュレーション]

verification:
  checks:
    - id: front-points-rendered
      what: 地球儀の前面にある点群プリミティブが鮮やかに描画されている
      how: getImageData で前面の基準点群座標のピクセル色を検証
      expected: 点プリミティブの鮮やかなカラー（黄・シアン・緑等）が検出される
    - id: backside-points-occluded
      what: 地球儀の裏側に回った点はオクルージョン判定により描画されない
      how: 地球儀を180度反転させたときの該当位置のピクセル色を検証
      expected: 背景宇宙色または海洋色が維持される
    - id: points-rotate-with-drag
      what: ドラッグ操作で地球儀を回転させたとき、点群が同期して正確に移動する
      how: 回転後の移動先ピクセルの色を検証
      expected: 移動先で点群カラーが検出される
  harness:
    - contextlost が起きたらエラーにする
