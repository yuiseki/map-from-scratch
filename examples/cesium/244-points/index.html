<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cesium: Points</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #05070d; font-family: system-ui, sans-serif; }
    #map { width: 100%; height: 100%; display: block; cursor: grab; }
    #map:active { cursor: grabbing; }
    .panel {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      color: #e2e8f0;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 10;
    }
    .panel b { color: #38bdf8; font-size: 14px; }
    .legend {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 4px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <canvas id="map"></canvas>
  <div class="panel">
    <div><b>Cesium 244</b>: Points</div>
    <div style="font-size: 11px; color: #94a3b8;">5,000 mass point primitives on 3D globe</div>
    <div class="legend">
      <span class="dot" style="background: #facc15;"></span>
      <span class="dot" style="background: #06b6d4;"></span>
      <span class="dot" style="background: #84cc16;"></span>
      <span class="dot" style="background: #ec4899;"></span>
      <span class="dot" style="background: #f97316;"></span>
      <span style="font-size: 10px; color: #64748b;">Batch rendered</span>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
