<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cesium 298 - Volumetric Atmosphere Cloud Layer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #03050a; font-family: sans-serif; }
    #canvas { width: 100%; height: 100%; display: block; }
    #ui {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(8, 12, 20, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 14px 18px;
      color: #e0e6ed;
      font-size: 13px;
      line-height: 1.5;
      backdrop-filter: blur(8px);
      max-width: 320px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    #ui h1 {
      font-size: 15px;
      margin-bottom: 8px;
      color: #7dd3fc;
      font-weight: 600;
    }
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
    }
    .control-row label {
      cursor: pointer;
    }
    input[type="range"] {
      width: 130px;
    }
    .hint {
      margin-top: 10px;
      font-size: 11px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <h1>Volumetric Atmospheric Clouds</h1>
    <div class="control-row">
      <label for="chk-rotate">Auto Orbit:</label>
      <input type="checkbox" id="chk-rotate" checked>
    </div>
    <div class="control-row">
      <label for="range-coverage">Cloud Coverage:</label>
      <input type="range" id="range-coverage" min="10" max="90" value="55">
    </div>
    <div class="control-row">
      <label for="range-sun">Sun Elevation:</label>
      <input type="range" id="range-sun" min="10" max="80" value="35">
    </div>
    <div class="hint">Raymarched 3D tropospheric cloud shell with Beer-Lambert absorption and Henyey-Greenstein forward Mie scattering. Drag to orbit, wheel to zoom.</div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
