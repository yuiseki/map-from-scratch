<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cesium 166 - Globe Translucency</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #020306; font-family: sans-serif; }
    #canvas { width: 100%; height: 100%; display: block; }
    #ui {
      position: absolute;
      top: 16px;
      left: 16px;
      color: #fff;
      background: rgba(8, 12, 22, 0.88);
      border: 1px solid rgba(80, 180, 255, 0.4);
      border-radius: 8px;
      padding: 14px 18px;
      backdrop-filter: blur(4px);
    }
    #ui h1 { font-size: 16px; margin-bottom: 6px; color: #64b5f6; }
    #ui p { font-size: 12px; color: #bbb; margin-bottom: 10px; }
    .controls { display: flex; flex-direction: column; gap: 8px; font-size: 12px; }
    .controls label { display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; color: #eee; }
    .controls input[type="range"] { accent-color: #64b5f6; cursor: pointer; width: 120px; }
    .controls input[type="checkbox"] { accent-color: #64b5f6; cursor: pointer; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <h1>Cesium 166: Globe Translucency</h1>
    <p>Semi-transparent crust revealing subterranean magma chambers, mantle, and radiant core</p>
    <div class="controls">
      <label>Crust Opacity: <input type="range" id="range-alpha" min="0.05" max="0.95" step="0.05" value="0.35"><span id="label-alpha">35%</span></label>
      <label><input type="checkbox" id="chk-subterranean" checked> Subterranean Features</label>
      <label><input type="checkbox" id="chk-rotate" checked> Auto Rotate</label>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
