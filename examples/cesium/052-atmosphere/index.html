<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cesium-052-atmosphere — Planetary Atmospheric Scattering</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #020306; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #canvas { width: 100%; height: 100%; display: block; }
    .overlay {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(10, 15, 28, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 16px;
      color: #fff;
      max-width: 320px;
      pointer-events: auto;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    h1 { font-size: 15px; margin-bottom: 6px; font-weight: 600; color: #60a5fa; }
    p { font-size: 12px; color: #94a3b8; line-height: 1.4; margin-bottom: 12px; }
    .controls { display: flex; flex-direction: column; gap: 10px; font-size: 12px; }
    .control-row { display: flex; justify-content: space-between; align-items: center; }
    label { color: #cbd5e1; }
    input[type="range"] {
      background: #1e293b;
      accent-color: #3b82f6;
    }
    .stats { margin-top: 12px; font-size: 11px; color: #64748b; border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 8px; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="overlay">
    <h1>Cesium Planetary Atmosphere</h1>
    <p>Real-time Rayleigh and Mie atmospheric scattering around a 3D Earth globe with sunset terminator extinction and luminous limb glow.</p>
    <div class="controls">
      <div class="control-row">
        <label for="sunSlider">Sun Angle</label>
        <input type="range" id="sunSlider" min="0" max="6.28" step="0.05" value="1.1">
      </div>
      <div class="control-row">
        <label for="densitySlider">Atmosphere Density</label>
        <input type="range" id="densitySlider" min="0.2" max="2.5" step="0.1" value="1.2">
      </div>
      <div class="control-row">
        <label for="autoRotate">Auto-Rotate Orbit</label>
        <input type="checkbox" id="autoRotate" checked>
      </div>
    </div>
    <div class="stats">
      <span>Drag to orbit • Wheel to zoom</span>
      <div id="fps">FPS: --</div>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
