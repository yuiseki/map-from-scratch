id: cesium-034-3d-tiles-point-cloud-shading
request: >-
  CesiumJS Sandcastle の「3D Tiles Point Cloud Shading」
  （https://sandcastle.cesium.com/?src=3d-tiles-point-cloud-shading）のように、
  密な点群を、点の減衰（幾何誤差と距離で点の大きさを決める）とアイドームライティング（EDL）で
  陰影をつけて見たい。減衰と EDL のオン・オフ、最大スクリーン空間誤差、幾何誤差スケール、
  最大減衰、基準解像度、EDL 強度、EDL 半径を操作できること。
  データは東京の実在の密な点群（GSJ 統合点群タイル、東京都の区部点群）で、
  街路と建物の輪郭が EDL で際立つ場所にする。

requirements:
  - id: real-point-cloud
    need: 東京駅・丸の内の実測点群を 3D で見る
    rationale: 開始視点でデータの正方形が画面の 60% 以上を占め、その 50% 以上が点で覆われ、4 ビット量子化で 150 色以上（実測 59.4%、187 色。performance_knowledge の opening-coverage）
    unmeasured: verification の opening-view-drawn で確かめる（数値予算ではなく画面検査）
  - id: opens-fast
    need: ページを開いてすぐ点群が出る
    rationale: 開始視点に必要な 4 つの z16 ノード（約 1.76 MB）と tileset.json を読み、描画し終えるまで。ローカル配信で 2.5 秒
  - id: loads-only-the-view
    need: 必要な詳細度のノードだけを読む
    rationale: 開始視点は根ノード 4 つで足りる（SSE 16）。開始時の読み込みは 2 MB 以下、計測全体（近接視点で葉ノードまで読む）でも全 37 MB の 2/3 以下の 25,000 KB
  - id: smooth-orbit
    need: EDL をかけたまま回転・ズームが滑らか
    rationale: 60 Hz の 1 フレーム 16.7 ms。旋回経路と近接・全詳細視点の両方の p95
  - id: lod-bounds-points
    need: 描く点の数が詳細度の選択で抑えられる
    rationale: 既定の SSE 16 では旋回中は根ノード（195,252 点）が中心だが、寄ると目が根の箱の中に入り z17 へ細分される（実測最大 498,500 点）ので上限 60 万点。SSE 2 の近接視点でも 200 万点以下
  - id: controls
    need: 原典と同じ操作（減衰・EDL のトグル、6 つのスライダー）がそれぞれ次のフレームで描画に反映される
    rationale: 入力イベントから描画完了まで 2 フレーム（33.4 ms）以内。描画が変わったことは verification の controls-redraw-next-frame で確かめる
  - id: shading-correct
    need: 減衰で点の隙間が埋まり、EDL で奥行きの段差だけが暗くなる
    unmeasured: verification の attenuation-fills-holes と edl-darkens-depth-edges で画面を読み戻して確かめる
  - id: attribution
    need: 出典を画面に示す
    unmeasured: index.html の帰属表示（東京都デジタルツイン実現プロジェクト、GSJ）を目視レビューで確かめる
  - id: light-page
    need: 地図エンジンや CesiumJS を読み込まない小さなページ
    rationale: 配布コード（index.html と 5 モジュール）の gzip 合計 12 KB 以下

evaluation:
  budgets:
    - {metric: first_frame_ms, stat: p50, max: 2500, unit: ms, requirement: opens-fast}
    - {metric: opening_bytes, stat: max, max: 2000000, unit: B, requirement: loads-only-the-view}
    - {metric: transfer_kb, stat: max, max: 25000, unit: KB, requirement: loads-only-the-view}
    - {metric: frame_ms, stat: p95, max: 16.7, unit: ms, requirement: smooth-orbit}
    - {metric: close_frame_ms, stat: p95, max: 16.7, unit: ms, requirement: smooth-orbit}
    - {metric: points_drawn, stat: max, max: 600000, unit: points, requirement: lod-bounds-points}
    - {metric: close_points_drawn, stat: max, max: 2000000, unit: points, requirement: lod-bounds-points}
    - {metric: control_redraw_ms, stat: p95, max: 33.4, unit: ms, requirement: controls}
    - {metric: code_gzip_bytes, max: 12000, unit: B, requirement: light-page}
  gates: [エラーがない, ハードウェアの GPU で描いている, verification の check がすべて通る]

benchmarks:
  runtime: browser
  page: examples/cesium/034-3d-tiles-point-cloud-shading/index.html
  viewport: {width: 1280, height: 800, device_scale_factor: 1, mobile: false}
  cpu_throttle: 1
  iterations: 3
  scenarios:
    - id: first-frame
      what: >-
        ナビゲーション開始から、開始視点（八重洲側から西向き、俯角 45°、距離 650 m、目はデータの正方形の上）で選ばれたノードが
        すべて読み込まれ、EDL つきで描画され、GPU が終わる（1 画素 readPixels）まで。
        同時に開始時点の読み込みバイト数・件数・描画点数を出す
      metrics: [first_frame_ms, opening_bytes, opening_requests, opening_points]
    - id: orbit
      what: >-
        EDL・減衰オン、SSE 16 で、東京駅の周りを 1 周しながら俯角 ±12°、距離を半分近くまで寄る 300 フレーム。
        経路で選ばれるノードは事前に読み込み、計測中は描画だけ
      metrics: [cpu_ms, frame_ms, gpu_ms, points_drawn]
    - id: close
      what: 俯角 40°・距離 220 m・SSE 2 で z18 の葉ノード（点間隔約 0.5 m）まで描く固定視点 60 フレーム
      metrics: [close_cpu_ms, close_frame_ms, close_gpu_ms, close_points_drawn]
    - id: controls
      what: >-
        近接視点で 6 つのスライダーと 2 つのトグルを DOM の input イベントで動かし、
        イベントから次の rAF でのページの描画と GPU 完了（1 画素 readPixels）までの時間。検査用の全画面読み戻しは含めない
      metrics: [control_redraw_ms]

datasets:
  bake: [node, examples/cesium/034-3d-tiles-point-cloud-shading/bake.ts]
  sources:
    - id: gsj-mixed-pcpng
      origin: https://tiles.gsj.jp/tiles/pcpng/mixed/index.html （元データ https://info.tokyo-digitaltwin.metro.tokyo.lg.jp/ 区部点群）
      license: 東京都デジタルツイン実現プロジェクト 区部点群データ（CC BY 4.0）を GSJ が点群 PNG タイル化したもの。東京都と GSJ を画面に表示する
  outputs:
    - data/baked/cesium-034-3d-tiles-point-cloud-shading/tileset.json
    - data/baked/cesium-034-3d-tiles-point-cloud-shading/nodes
  preparation:
    - GSJ 統合点群タイルの z16 2×2、z17 4×4、z18 8×8（計 84 枚、東京駅を含む約 1 km 四方）を取得し src/ にキャッシュ（公開しない）
    - gdal_translate で可逆 WebP を生の RGBA にし、点群 PNG 1.0 の列（x, y はメルカトル、z は cm、RGB）を pcpng.ts で読む
    - 東京駅（139.7671, 35.6812）からの東・北・上のメートルに変換（メルカトルを cos(緯度) 倍、この範囲ではほぼ実寸）
    - 標高 -15〜320 m の外は雑音として捨てる（157 点）
    - タイル 1 枚を 1 ノードにした置換型 LOD 木。子は親の 1/4 の範囲に同じくらいの点数（GSJ がズームごとに約 5 万点へ間引いている）
    - 各ノードの点を箱の中で uint16 に量子化し、xyz を 6 バイト、続けて RGB を 3 バイト（9 バイト/点）。GPU にそのまま上げる
    - 内側ノードの幾何誤差は平均点間隔 sqrt(面積/点数)、葉は 0（3D Tiles の慣例。葉の減衰は基準解像度か Cesium の推定 cbrt(体積/点数) に落ちる）
    - 結果 84 ノード、4,115,231 点、ノードファイル計 37,037,079 B（1 ファイル最大約 0.55 MB）

performance_knowledge:
  - id: gsj-pyramid-is-a-replace-lod
    finding: GSJ 統合点群タイルはズームごとに 1 タイル約 5 万点へ間引かれているので、タイル木をそのまま置換型 LOD 木として使える
    evidence: 浅草の同じ地点で z16 48,960、z17 53,631、z18 55,411、z19 58,034 点。WebP は 276〜337 KB とほぼ一定。東京駅周辺 84 枚のベイクでも 31,085〜60,706 点/枚
    applies_when: GSJ 点群タイルから LOD つきの点群描画を作るとき
  - id: leaf-geometric-error-estimate-is-coarse
    finding: Cesium の葉の幾何誤差の推定 cbrt(体積/点数) は、高層ビルのある航空 LiDAR では実際の点間隔の約 7 倍になる
    evidence: z18 の葉（124 m × 124 m × 高さ最大 160 m、約 5.5 万点）で推定 3.5 m、平均点間隔 sqrt(面積/点数) は約 0.53 m。基準解像度スライダーで 0.5 前後を与えると葉の点が実際の間隔の大きさになる
    applies_when: 3D Tiles の葉の幾何誤差が 0 の点群で減衰を使うとき
  - id: first-gpu-run-2026-11-03
    finding: RTX 3060 での初回計測（--site）で 4 項目が落ちた。描画器の誤りは開始視点の構図だけで、残りは検査と予算の見積もりの誤りだった
    evidence: >-
      初回: points_drawn 最大 673,500（予算 40 万）、opening-view-drawn 34.3%・183 色、edl-darkens-depth-edges は段差・平面とも輝度比中央値 1.000、
      controls-redraw-next-frame は EDL 強度 1→0.1 で 0.0%。修正後（2026-11-03、-n 1、負荷平均約 30）: first_frame_ms 338.9、frame_ms p95 1.485、
      close_frame_ms p95 1.66、points_drawn 最大 498,500、close 1,080,000 点、control_redraw_ms p95 11.8、transfer_kb 18,380、code_gzip_bytes 9,348、検査 5 件すべて合格
    applies_when: この例を再計測するとき
  - id: edl-saturates
    finding: >-
      EDL は動いていた。Cesium と同じ exp(-300 × 強度 × 平均 log2 差) は強く、数 m の段差の隣はほぼ黒、同じ点の四角の中と平らな面は 1.0 のままになる。
      強度 1→4 は黒→黒で画素が変わらず、高さマップ上の段差の画素は手前の点の四角に覆われて EDL の黒い縁はその外側に出るため、旧検査は効果なしと読んだ
    evidence: >-
      真上 300 m で EDL により輝度が半分未満になった画素 33,500（覆われた画素 532,644 のうち）の 99.3% がデータの 3 m の段差から 4 px 以内（覆われた画素全体では 48.3%）、
      平らな所 26,600 画素の輝度比中央値 1.000。強度 1→0.1 では画素の 5.2% が変わる（1→4 では 0.0%）。検査を「暗くなった画素が段差の近くに偏る」形に、操作の検査を強度 1→0.1 に変えた
    applies_when: EDL の効果を画面で検査するとき。強度を上げる方向は飽和して変化が出ない
  - id: opening-coverage
    finding: >-
      旧開始視点（俯角 28°、距離 820 m）は目がデータの東端（x 584 m）の外の x 684 m にあり、画面の上と右がデータの外だった。
      目を正方形の上に置き（目標 (60, -140)、俯角 45°、距離 650 m）、検査はデータの正方形の内側の被覆率で見る形にした。
      内側でも約 4 割が背景なのは、Cesium の減衰が点の大きさを平均点間隔（z16 で約 2.2 m）から決め、斜め視の短縮を考えないため
    evidence: 新しい視点で正方形が画面の 66.3%、その内 59.4% が点、画面全体では 44.6%（旧 34.3%）、187 色。しきい値を 50% と 150 色にした
    applies_when: 減衰つき点群の被覆率を検査するとき。SSE 16 の根ノードでは斜め視で隙間が残るのが仕様どおり
  - id: lod-eye-inside-box
    finding: 高層ビルで根の箱が高さ 250 m あり、旋回経路で 369 m まで寄ると目と箱の距離が小さく（または 0）なって z17 へ細分される。予算 40 万点は根ノードだけを想定した見積もりの誤り
    evidence: 旋回 300 フレームの描画点数 p50 195,300、p95 448,200、最大 498,500（旧視点では最大 673,500）。予算を 60 万点にした
    applies_when: 背の高い箱の LOD で、箱までの距離で SSE を測るとき
  - id: redraw-timing-excluded-readback
    finding: control_redraw_ms に検査用の全画面読み戻し（1280×800 の drawImage と getImageData）が入っていた
    evidence: 読み戻しを含めて p95 35.91 ms、GPU 完了で止めて p95 11.8 ms（p50 3.865）
    applies_when: 入力から描画までを測る区間に検査の処理を入れないこと

architecture_selection:
  chosen:
    platform: browser
    api: WebGL2（点のパスを RGBA8 + DEPTH_COMPONENT32F のテクスチャへ、全画面パスで EDL）
    language: TypeScript（型ストリップ配信）
    gpu: hardware
    code:
      - examples/cesium/034-3d-tiles-point-cloud-shading/index.html
      - examples/cesium/034-3d-tiles-point-cloud-shading/main.ts
      - examples/cesium/034-3d-tiles-point-cloud-shading/render.ts
      - examples/cesium/034-3d-tiles-point-cloud-shading/shading.ts
      - examples/cesium/034-3d-tiles-point-cloud-shading/camera.ts
      - examples/cesium/034-3d-tiles-point-cloud-shading/lod.ts
    dependencies: []
    why: >-
      減衰は頂点シェーダーの gl_PointSize = min(幾何誤差 / 深度 × 深度係数, 最大減衰) だけで済み、
      EDL は深度テクスチャを読む 1 枚の全画面パスで済む。点はノードファイルのまま GPU に上げ、
      シェーダーで箱の範囲に戻すので CPU での復号がない。
  alternatives:
    - option: EDL 用に対数深度を R32F のカラーアタッチメントへ書く（Cesium の深度 G バッファに近い）
      rejected_because: EXT_color_buffer_float と MRT が要る。ハードウェア深度テクスチャから目の深度を戻して log2 をとれば同じ値になる。計測での比較はしていない
    - option: 23-taito-point-cloud のように GSJ の WebP タイルを実行時に読んで復号する
      rejected_because: タイルごとに createImageBitmap と getImageData と列の復号が要り、範囲も固定したいのでベイクにした。比較は計測時に行う
    - option: 円形の点（フラグメントで discard）
      rejected_because: Cesium の点群は四角の点。discard は早期深度テストを妨げる。比較していない
  not_doing:
    - 原典の点群切り替え（St. Helens / Church）。東京駅周辺の 1 データセットだけ
    - 地形・地球・地図タイル
    - 3D Tiles（pnts / glb）の読み込み。ベイク済みの独自形式だけ
    - レベルスキップ、ノードの破棄（全 37 MB でも GPU に収まる）
    - 法線による陰影、背面カリング、スタイル式
    - 画面で選んだ点の情報表示

verification:
  checks:
    - id: opening-view-drawn
      what: 開始視点が実データの点で覆われている
      how: 開始視点で全画面を readBack し、根ノードの正方形を地上 5 m で投影した四角形の内側の画素のうち背景色以外の割合と、4 ビット量子化した色の種類を数える
      expected: 正方形が画面の 60% 以上を占め、その 50% 以上が点、150 色以上
    - id: attenuation-fills-holes
      what: 減衰オンで点の隙間（背景が見える画素）が減る
      how: 開始視点の下中央（縦 50〜95%、横 25〜75%、データの正方形の内側）で、減衰のチェックボックスをオン・オフして背景色の画素を数える
      expected: オフで 5% 以上の穴があり、オンの穴がオフの半分以下
    - id: edl-darkens-depth-edges
      what: EDL は奥行きの段差のそばを暗くし、平らな所（道路・屋上）はほとんど変えない
      how: >-
        真上から 300 m で EDL オン・オフの画面を読み戻し、輝度比を求める。段差と平面は描画器ではなくデータから決める：
        描画中のノードの点を同じカメラで投影した高さマップで、9×9 画素の窓の高さの幅が 3 m 以上なら段差の近く、
        5×5 近傍の点（4 点以上）がすべて ±0.3 m 以内なら平面とする
      expected: >-
        輝度が半分未満になった画素が覆われた画素の 0.5% 以上あり、その 80% 以上が段差の近く、かつ覆われた画素全体の段差の近くの割合より 10 ポイント以上高い。
        平面 200 画素以上で輝度比の中央値 0.95 以上
    - id: controls-redraw-next-frame
      what: 6 つのスライダーと 2 つのトグルが、それぞれ次のフレームで画面を変える
      how: >-
        近接視点（SSE 2、葉ノードを描画）で各要素の値を変えて input イベントを送り、次の rAF の中で readBack して
        直前の画面と比べる（最大減衰 0→4、基準解像度 0→0.3、幾何誤差スケール 1→0.05、SSE 2→1、EDL 強度 1→0.1、EDL 半径 1→3、EDL オフ、減衰オフ）
      expected: どの操作でも画素の 0.5% 以上が変わる
    - id: drag-and-wheel-move-view
      what: ドラッグで回転、ホイールで寄る
      how: キャンバスに合成の pointerdown / pointermove（右へ 80 px）/ pointerup と wheel（deltaY -200）を送り、次のフレームで比べる
      expected: 方位が 24° 増え、距離が縮み、画素の 5% 以上が変わる
  harness:
    - webglcontextlost が起きたらエラーにする
    - info.gpu がソフトウェアラスタライザならエラー（gpu: hardware）
