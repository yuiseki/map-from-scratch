<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cesium: Lighting</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #05070d; font-family: system-ui, sans-serif; }
    #map { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
    #map:active { cursor: grabbing; }
    .panel {
      position: absolute; top: 12px; left: 12px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 10px 14px; border-radius: 8px; font-size: 13px; color: #e2e8f0;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      display: flex; flex-direction: column; gap: 6px; z-index: 10;
    }
    .panel b { color: #38bdf8; font-size: 14px; }
    .panel .sub { font-size: 11px; color: #94a3b8; }
    .sun { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
    .sun input { width: 170px; accent-color: #fbbf24; }
    .sun output { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: #fbbf24; min-width: 42px; }
  </style>
</head>
<body>
  <canvas id="map"></canvas>
  <div class="panel">
    <div><b>Cesium 209</b>: Lighting</div>
    <div class="sub">Sun fixed in world space · equinox (sub-solar lat 0°)</div>
    <div class="sun">
      <span class="sub">sun</span>
      <input id="sun" type="range" min="-180" max="180" step="1" value="40">
      <output id="sunOut">40°E</output>
    </div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
