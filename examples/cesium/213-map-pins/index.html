<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cesium: Map Pins</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #05080f; font-family: system-ui, sans-serif; }
    #globe { width: 100%; height: 100%; display: block; cursor: grab; }
    #globe:active { cursor: grabbing; }
    .panel {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(18, 24, 38, 0.9);
      color: #e0e8f0;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 10;
    }
    .panel b { color: #64b5f6; font-size: 14px; }
    .legend { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  </style>
</head>
<body>
  <canvas id="globe"></canvas>
  <div class="panel">
    <div><b>Cesium 213</b>: Map Pins</div>
    <div class="legend"><span class="dot" style="background:#4caf50"></span> London [-0.13, 51.51]</div>
    <div class="legend"><span class="dot" style="background:#03a9f4"></span> Washington [-77.04, 38.91]</div>
    <div class="legend"><span class="dot" style="background:#f44336"></span> Tokyo [139.69, 35.69]</div>
    <div style="font-size:11px; color:#90a4ae; margin-top:2px;">Drag to rotate • Backside pins occlude</div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
