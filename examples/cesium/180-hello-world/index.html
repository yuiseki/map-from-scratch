<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cesium: Hello World</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #05080f; font-family: system-ui, sans-serif; }
    #globe { width: 100%; height: 100%; display: block; cursor: grab; }
    #globe:active { cursor: grabbing; }
    .panel {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(18, 24, 38, 0.9);
      color: #e0e8f0;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 10;
    }
    .panel b { color: #64b5f6; font-size: 14px; }
  </style>
</head>
<body>
  <canvas id="globe"></canvas>
  <div class="panel">
    <div><b>Cesium 180</b>: Hello World (3D Globe)</div>
    <div style="font-size:12px; color:#90a4ae;">Drag to rotate • Wheel to zoom</div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
