<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cesium 060 - Bloom</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #030408; font-family: sans-serif; }
    #canvas { width: 100%; height: 100%; display: block; }
    #ui {
      position: absolute;
      top: 16px;
      left: 16px;
      color: #fff;
      background: rgba(8, 10, 18, 0.88);
      border: 1px solid rgba(255, 60, 200, 0.4);
      border-radius: 8px;
      padding: 14px 18px;
      backdrop-filter: blur(4px);
    }
    #ui h1 { font-size: 16px; margin-bottom: 6px; color: #ff4081; }
    #ui p { font-size: 12px; color: #bbb; margin-bottom: 10px; }
    .controls { display: flex; flex-direction: column; gap: 8px; font-size: 12px; }
    .controls label { display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; color: #eee; }
    .controls input[type="range"] { accent-color: #ff4081; cursor: pointer; width: 110px; }
    .controls input[type="checkbox"] { accent-color: #ff4081; cursor: pointer; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <h1>Cesium 060: Bloom</h1>
    <p>HDR glow post-processing pipeline with bright pass extraction and separable Gaussian blur</p>
    <div class="controls">
      <label><input type="checkbox" id="chk-bloom" checked> Enable Bloom Glow</label>
      <label>Intensity: <input type="range" id="range-intensity" min="0.0" max="4.0" step="0.2" value="1.6"><span id="label-intensity">1.6x</span></label>
      <label><input type="checkbox" id="chk-rotate" checked> Auto Rotate</label>
    </div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
