<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cesium 231 - Particle System</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0a0e17; font-family: sans-serif; }
    #canvas { width: 100%; height: 100%; display: block; }
    #ui {
      position: absolute;
      top: 16px;
      left: 16px;
      color: #fff;
      background: rgba(10, 14, 23, 0.85);
      border: 1px solid rgba(255, 120, 20, 0.4);
      border-radius: 8px;
      padding: 12px 16px;
      pointer-events: none;
      backdrop-filter: blur(4px);
    }
    #ui h1 { font-size: 16px; margin-bottom: 4px; color: #ff9800; }
    #ui p { font-size: 12px; color: #ccc; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <h1>Cesium 231: Particle System</h1>
    <p>High-energy rocket exhaust / fire plume simulation with smoke billow and embers</p>
    <p>Left drag to orbit &bull; Wheel to zoom</p>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
