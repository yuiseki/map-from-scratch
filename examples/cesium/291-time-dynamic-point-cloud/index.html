<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cesium 291 - Time Dynamic Point Cloud</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #04060c; font-family: sans-serif; }
    #canvas { width: 100%; height: 100%; display: block; }
    #ui {
      position: absolute;
      top: 16px;
      left: 16px;
      color: #fff;
      background: rgba(10, 14, 26, 0.88);
      border: 1px solid rgba(0, 220, 255, 0.4);
      border-radius: 8px;
      padding: 14px 18px;
      backdrop-filter: blur(4px);
    }
    #ui h1 { font-size: 16px; margin-bottom: 6px; color: #00e5ff; }
    #ui p { font-size: 12px; color: #bbb; margin-bottom: 10px; }
    .controls { display: flex; flex-direction: column; gap: 8px; font-size: 12px; }
    .controls label { display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; color: #eee; }
    .controls input[type="range"] { accent-color: #00e5ff; cursor: pointer; width: 110px; }
    button {
      background: #00e5ff;
      border: none;
      color: #000;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <h1>Cesium 291: Time Dynamic Point Cloud</h1>
    <p>4D pulsating harmonic surface waves with elevation-tinted particle splatting</p>
    <div class="controls">
      <button id="btn-play">Pause</button>
      <label>Speed: <input type="range" id="range-speed" min="0.0" max="3.0" step="0.2" value="1.0"></label>
      <label>Point Size: <input type="range" id="range-size" min="4.0" max="30.0" step="1.0" value="14.0"></label>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
