<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MapLibre: Create a heatmap layer</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1326; font-family: system-ui, sans-serif; }
    #map { width: 100%; height: 100%; display: block; cursor: grab; }
    #map:active { cursor: grabbing; }
    .panel {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(11, 19, 38, 0.92);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      color: #e2e8f0;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 10;
    }
    .panel b { color: #38bdf8; font-size: 14px; }
    .ramp {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 4px;
    }
    .ramp-bar {
      width: 160px;
      height: 8px;
      border-radius: 4px;
      background: linear-gradient(to right, #1e3a8a, #38bdf8, #f59e0b, #ef4444, #ffffff);
    }
    .ramp-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <canvas id="map"></canvas>
  <div class="panel">
    <div><b>MapLibre 053</b>: Heatmap Layer</div>
    <div style="font-size: 11px; color: #94a3b8;">6,107 USGS earthquakes with magnitude weighting</div>
    <div class="ramp">
      <div class="ramp-bar"></div>
      <div class="ramp-labels">
        <span>Low</span>
        <span>Medium</span>
        <span>High Density</span>
      </div>
    </div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
