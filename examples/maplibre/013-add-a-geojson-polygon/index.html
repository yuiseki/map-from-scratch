<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MapLibre: Add a GeoJSON polygon</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #b8d6e8; font-family: system-ui, sans-serif; }
    #map { width: 100%; height: 100%; display: block; cursor: grab; }
    #map:active { cursor: grabbing; }
    .panel {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(255, 255, 255, 0.94);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }
    .panel b { color: #1f3a52; font-size: 14px; }
    .btn-group { display: flex; gap: 6px; align-items: center; }
    .btn-group button {
      background: #f0f0f0;
      border: 1px solid #ccc;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .btn-group button:hover { background: #e0e0e0; }
  </style>
</head>
<body>
  <canvas id="map"></canvas>
  <div class="panel">
    <div><b>MapLibre 013</b>: Add a GeoJSON polygon (Maine)</div>
    <div class="btn-group">
      <span>Color:</span>
      <button data-color="#008888" style="border-left: 4px solid #008888;">Teal</button>
      <button data-color="#ff8800" style="border-left: 4px solid #ff8800;">Orange</button>
      <button data-color="#880088" style="border-left: 4px solid #880088;">Purple</button>
    </div>
    <div class="btn-group">
      <span>Opacity:</span>
      <button data-opacity="0.4">0.4</button>
      <button data-opacity="0.8">0.8</button>
      <button data-opacity="1.0">1.0</button>
      <button id="reset-btn" style="margin-left: 6px;">Reset</button>
    </div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
