id: maplibre-045-change-the-default-position-for-attribution
request: >-
  MapLibre の "Change the default position for attribution" 例と同じく、
  ワシントン DC 周辺 [-77.04, 38.907]・ズーム 2 の地図で、既定の右下ではなく
  左上に出典表示（attribution）を置きたい。地図をパン・ズームしても出典表示は
  画面の同じ位置に留まる。外部ライブラリなしで、最速・最小で。

requirements:
  - id: light-footprint
    need: 外部依存ゼロで配布サイズを最小限に抑える
    rationale: 静的な地図と小さな出典表示だけに汎用エンジン全体の読み込みは不要
  - id: quick-start
    need: ページを開いて即座に地図と出典表示が現れる
    rationale: 初期化ラグなしで 300 ms 以内に表示
  - id: smooth-interaction
    need: ドラッグによるパンや拡大縮小が 60 fps で滑らかに追従する
    rationale: 60 Hz の1フレームは 16.7 ms
  - id: top-left-attribution
    need: 出典表示が既定の右下ではなく左上に余白 12 px で置かれ、既定の隅は空いている
    unmeasured: verification の checks で矩形・箱・文字ピクセルを検証

evaluation:
  budgets:
    - {metric: code_gzip_bytes, max: 4200, unit: B, requirement: light-footprint}
    - {metric: data_gzip_bytes, max: 38000, unit: B, requirement: light-footprint}
    - {metric: first_frame_ms, stat: p50, max: 300, unit: ms, requirement: quick-start}
    - {metric: redraw_ms, stat: p95, max: 2.0, unit: ms, requirement: smooth-interaction}
    - {metric: frame_interval_ms, stat: p95, max: 20, unit: ms, requirement: smooth-interaction}
  gates: [エラーがない, verification の check がすべて通る]

benchmarks:
  runtime: browser
  page: examples/maplibre/045-change-the-default-position-for-attribution/index.html
  viewport: {width: 1024, height: 768, device_scale_factor: 1, mobile: false}
  cpu_throttle: 1
  iterations: 3
  scenarios:
    - id: first-frame
      what: 陸地データの取得から出典表示を含む初回描画まで
      metrics: [first_frame_ms]
    - id: pan
      what: 60フレームのパン操作中の再描画時間とフレーム間隔
      metrics: [redraw_ms, frame_interval_ms]

datasets:
  bake: [node, examples/maplibre/045-change-the-default-position-for-attribution/bake.ts]
  sources:
    - id: ne-110m-land
      origin: https://github.com/nvkelso/natural-earth-vector/tree/master/geojson
      license: Natural Earth パブリックドメイン
  outputs:
    - data/baked/maplibre-045-change-the-default-position-for-attribution/land.json
  preparation:
    - Natural Earth 110m 陸地ポリゴンを Web Mercator 座標 [0, 1] に投影して量子化
    - 初期中心 [-77.04, 38.907]・ズーム 2 は元例の定数をそのまま使う

performance_knowledge:
  - id: screen-anchored-chrome
    finding: 出典表示は地理座標ではなく画面座標で描く。地図のカメラ更新とは独立した矩形1個なので、パン・ズームで再計算するものがない
    evidence: attribution-fixed-on-pan / attribution-fixed-on-zoom が 120×90 px パンと zoom 3.5 の後も矩形の完全一致
  - id: default-corner-must-stay-empty
    finding: 「左上へ移した」ことは、左上に箱があるだけでは証明できない。既定の右下・左下が空いていることも同時に検証しないと、両方に描く退行を見逃す
    evidence: default-corners-free が左右下隅の箱色と暗色文字 0 個を確認
  - id: text-readback
    finding: 白い箱だけでなく暗い文字ピクセル数を数えると、箱はあるが文字が描かれていない退行を検出できる
    evidence: 左上の BOX_W×BOX_H 内の暗色ピクセルが 20 個超

architecture_selection:
  chosen:
    platform: browser
    api: Canvas 2D
    language: TypeScript (型ストリップ配信)
    gpu: none
    code:
      - examples/maplibre/045-change-the-default-position-for-attribution/index.html
      - examples/maplibre/045-change-the-default-position-for-attribution/main.ts
      - examples/maplibre/045-change-the-default-position-for-attribution/attribution.ts
    dependencies: []
    why: 陸地塗りと 1 枚の出典表示だけなら Canvas 2D が最小。文字も fillText で完結する
  alternatives:
    - option: DOM の div を隅に配置する
      rejected_because: CSS だけで済むが、この例は Canvas への描画・読み戻し検証を一貫させたい
    - option: WebGL2
      rejected_because: 静的な陸地と文字に初期化コストが見合わない
  not_doing: [3D地形, 地名ラベル, 四隅の切り替え UI, 回転・ピッチ, ピンチズーム, ベクタータイルデコード]

verification:
  checks:
    - id: attribution-visible-top-left
      what: 出典表示が左上に余白 12 px で出て、暗い文字が読める
      how: ビューポートから独立に矩形を計算し、箱の内側の白ピクセルと暗色ピクセル数を数える
      expected: 'rect (12, 12, 222, 28)、箱が白、暗色ピクセル > 20'
    - id: default-corners-free
      what: 既定の右下・左下には出典表示がない
      how: 両隅の箱の白ピクセルと暗色ピクセル数を数える
      expected: '両隅とも箱でない、暗色ピクセル < 5'
    - id: map-rendered-at-target
      what: 中心のワシントン DC は陸地、[-60, 30] は大西洋
      how: 独立投影した画面座標のピクセル色を検証
      expected: '中心が陸地色、[-60,30] が海洋色'
    - id: attribution-fixed-on-pan
      what: 地図を 120×90 px パンしても出典表示は動かない
      how: panBy(120, 90) 前後で矩形と、地物の画面位置が +120, +90 px 動くことを比較
      expected: '矩形が完全一致、地物は 120, 90 px 移動'
    - id: attribution-fixed-on-zoom
      what: zoom 3.5 にしても出典表示は動かない
      how: setZoom(3.5) 前後で矩形と箱・文字を比較
      expected: 'zoom 3.5、矩形が完全一致、箱と文字が残る'
  harness:
    - contextlost が起きたらエラーにする
