<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bear heatmap on terrain</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #e6eef5; font: 13px/1.4 system-ui, sans-serif; color: #1d2733; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    canvas:active { cursor: grabbing; }
    #panel { position: absolute; top: 10px; left: 10px; background: rgba(255,255,255,.92); border-radius: 6px; padding: 8px 12px; box-shadow: 0 1px 4px rgba(0,0,0,.25); max-width: calc(100% - 44px); }
    #panel h1 { font-size: 14px; margin: 0 0 4px; }
    #panel label { display: grid; grid-template-columns: 5.5em 1fr 3em; align-items: center; gap: 6px; margin: 2px 0; }
    #panel input[type=range] { width: 100%; }
    #panel .hint { color: #556; font-size: 12px; margin-top: 4px; }
    #attr { position: absolute; right: 0; bottom: 0; background: rgba(255,255,255,.85); padding: 2px 6px; font-size: 11px; max-width: 100%; }
    #attr a { color: #1d4f91; }
    #err { position: absolute; inset: 40% 10% auto; color: #a00; text-align: center; }
  </style>
</head>
<body>
  <canvas id="map"></canvas>
  <div id="panel">
    <h1>秋田県のクマ出没ヒートマップ（地形つき地球儀）</h1>
    <label>半径 <input id="radius" type="range" min="2" max="60" step="1" value="15"><output id="radiusOut">15</output></label>
    <label>強度 <input id="intensity" type="range" min="0.02" max="2" step="0.02" value="0.2"><output id="intensityOut">0.2</output></label>
    <label>年 <select id="year"><option value="0">すべて</option></select><output id="count"></output></label>
    <div class="hint">ドラッグで回転・傾き、Shift+ドラッグで移動、ホイールで拡大縮小</div>
  </div>
  <div id="attr">
    標高 © <a href="https://mapterhorn.com/attribution/">Mapterhorn</a>（日本は国土地理院 基盤地図情報を含む）|
    出典：秋田県「<a href="https://ckan.pref.akita.lg.jp/dataset/050008_shizenhogoka_003">ツキノワグマ等情報マップシステム『クマダス』データ</a>」（CC BY 4.0）を加工して作成
  </div>
  <div id="err"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
