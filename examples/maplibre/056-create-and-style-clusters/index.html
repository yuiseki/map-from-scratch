<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>世界の地震クラスタ</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #102533; color: #e8f2f8; font: 14px/1.5 system-ui, sans-serif; }
  #map, #labels, #land { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #land { pointer-events: none; }
  #map { touch-action: none; }
  #labels { pointer-events: none; }
  .panel { position: fixed; top: 14px; right: 14px; width: min(340px, calc(100% - 28px)); padding: 13px 15px; border: 1px solid #426072; border-radius: 12px; background: #102533e8; box-shadow: 0 8px 24px #0006; }
  h1 { font-size: 17px; margin: 0 0 6px; }
  p { margin: 5px 0; }
  small { color: #b9d0db; }
  #popup { position: fixed; display: none; padding: 8px 10px; border: 1px solid #628397; border-radius: 6px; background: #102533f0; pointer-events: none; }
  footer { position: fixed; bottom: 10px; right: 10px; max-width: min(460px, calc(100% - 20px)); padding: 5px 8px; border-radius: 5px; background: #102533e8; font-size: 11px; }
  a { color: #aadfff; }
</style>
<canvas id="land" aria-hidden="true"></canvas>
<canvas id="map" aria-label="世界の地震をズームごとに集約した地図"></canvas>
<canvas id="labels" aria-hidden="true"></canvas>
<div class="panel">
  <h1>世界の地震クラスタ</h1>
  <p id="status">読み込み中…</p>
  <small>ドラッグで移動、ホイールで拡大・縮小。円をクリックするとクラスタを展開し、単点ではマグニチュードを表示します。</small>
</div>
<div id="popup"></div>
<footer>地震データ: <a href="https://maplibre.org/maplibre-gl-js/docs/examples/create-and-style-clusters/">MapLibre 公式例</a> / <a href="https://www.usgs.gov/information-policies-and-instructions/copyrights-and-credits">USGS</a> · 陸地: <a href="https://www.naturalearthdata.com/">Natural Earth</a></footer>
<script type="module" src="./main.js"></script>
