<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MapLibre: Fit a map to a bounding box</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #b8d6e8; font-family: system-ui, sans-serif; }
    #map { width: 100%; height: 100%; display: block; cursor: grab; }
    #map:active { cursor: grabbing; }
    .panel {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(255, 255, 255, 0.94);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      z-index: 10;
      max-width: 340px;
    }
    .panel b { color: #1f3a52; font-size: 14px; }
    button {
      display: block;
      margin: 8px 0 2px;
      padding: 6px 12px;
      font: inherit;
      border: 1px solid #1f3a52;
      border-radius: 6px;
      background: #ffffff;
      color: #1f3a52;
      cursor: pointer;
    }
    button:hover { background: #eef4f8; }
  </style>
</head>
<body>
  <canvas id="map"></canvas>
  <div class="panel">
    <div><b>MapLibre 096</b>: Fit a map to a bounding box</div>
    <div>Opens over New York; fit to [[32.96, -5.35], [43.51, 5.62]].</div>
    <button id="fit" type="button">Fit to the bounding box</button>
    <div style="font-size: 11px; color: #667; border-top: 1px solid #ddd; padding-top: 6px;">
      Base map: © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>
      contributors, © <a href="https://openmaptiles.org/">OpenMapTiles</a> (OSM Carto via tile.yuiseki.net)
    </div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
