<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MapLibre: Restrict map panning to an area</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #b8d6e8; font-family: system-ui, sans-serif; }
    #map { width: 100%; height: 100%; display: block; cursor: grab; }
    #map:active { cursor: grabbing; }
    .panel {
      position: absolute;
      top: 12px;
      left: 12px;
      max-width: 300px;
      background: rgba(255, 255, 255, 0.94);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      z-index: 10;
    }
    .panel b { color: #1f3a52; font-size: 14px; }
    .panel .hint { color: #445; margin-top: 4px; }
    .panel .bounds { margin-top: 6px; font-size: 11px; color: #556; font-variant-numeric: tabular-nums; }
    .panel button {
      margin-top: 8px;
      background: #f0f0f0;
      border: 1px solid #ccc;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .panel button:hover { background: #e0e0e0; }
    .panel .attribution { margin-top: 8px; font-size: 11px; color: #667; border-top: 1px solid #ddd; padding-top: 6px; }
  </style>
</head>
<body>
  <canvas id="map"></canvas>
  <div class="panel">
    <div><b>MapLibre 115</b>: Restrict map panning to an area</div>
    <div class="hint">Drag or zoom out: the camera stops at New York's <code>maxBounds</code>.</div>
    <div class="bounds">
      SW [-74.04729, 40.68393]<br>
      NE [-73.91059, 40.87765]
    </div>
    <button id="reset-btn">Reset view</button>
    <div class="attribution">
      Base map: © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>
      contributors, © <a href="https://openmaptiles.org/">OpenMapTiles</a> (OSM Carto via tile.yuiseki.net)
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
