<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MapLibre GL JS - Animate symbol to follow the mouse</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #e2e8f0; }
    #map-canvas { width: 100vw; height: 100vh; display: block; cursor: crosshair; }
    #info-box {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(4px);
      padding: 12px 16px;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      font-size: 13px;
      color: #334155;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 10;
      pointer-events: none;
    }
    .title { font-weight: 600; color: #0f172a; font-size: 14px; }
    .coords { font-family: monospace; font-size: 12px; color: #2563eb; }
    .instruction { font-size: 11px; color: #64748b; }
  </style>
</head>
<body>
  <div id="info-box">
    <div class="title">Animate symbol to follow the mouse</div>
    <div class="coords" id="coords-display">Longitude: 0.000, Latitude: 0.000</div>
    <div class="instruction">Move cursor across the map</div>
  </div>
  <canvas id="map-canvas"></canvas>
  <script type="module" src="./main.ts"></script>
</body>
</html>
