<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MapLibre: Display a non-interactive map</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #aad3df; font-family: system-ui, sans-serif; }
    #map { width: 100%; height: 100%; display: block; cursor: default; }
    .panel {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(255, 255, 255, 0.94);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      z-index: 10;
    }
    .panel b { color: #1f3a52; font-size: 14px; }
    .badge {
      display: inline-block;
      margin-top: 4px;
      background: #e2e8f0;
      color: #475569;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <canvas id="map"></canvas>
  <div class="panel">
    <div><b>MapLibre 070</b>: Display a non-interactive map</div>
    <div class="badge">interactive: false (pan/zoom disabled)</div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
