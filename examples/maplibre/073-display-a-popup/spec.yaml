id: maplibre-073-display-a-popup
request: >-
  中心座標 [-96.0, 37.8]、ズーム 3 で地図を表示し、
  指定座標に「Hello World!」の吹き出し型ポップアップを常時表示・開閉可能にし、
  ドラッグでパン、ホイールで拡大縮小できる地図を作りたい。外部ライブラリなしで、最速・最小で。

requirements:
  - id: light-footprint
    need: 外部依存ゼロで配布サイズを最小限に抑える
    rationale: 1個のポップアップと背景地図に汎用エンジン全体の読み込みは不要
  - id: quick-start
    need: ページを開いて即座に地図とポップアップが現れる
    rationale: 初期化ラグなしで 300 ms 以内に表示
  - id: smooth-interaction
    need: ドラッグによるパンや拡大縮小が 60 fps で滑らかに追従する
    rationale: 60 Hz の1フレームは 16.7 ms
  - id: popup-accuracy
    need: ポップアップの突起先端が常に指定地理座標に固定され、開閉状態が正確に反映される
    unmeasured: verification の checks で画面ピクセル色と座標変化を検証

evaluation:
  budgets:
    - {metric: code_gzip_bytes, max: 3500, unit: B, requirement: light-footprint}
    - {metric: data_gzip_bytes, max: 38000, unit: B, requirement: light-footprint}
    - {metric: first_frame_ms, stat: p50, max: 300, unit: ms, requirement: quick-start}
    - {metric: redraw_ms, stat: p95, max: 2.0, unit: ms, requirement: smooth-interaction}
    - {metric: frame_interval_ms, stat: p95, max: 20, unit: ms, requirement: smooth-interaction}
  gates: [エラーがない, verification の check がすべて通る]

benchmarks:
  runtime: browser
  page: examples/maplibre/073-display-a-popup/index.html
  viewport: {width: 1024, height: 768, device_scale_factor: 1, mobile: false}
  cpu_throttle: 1
  iterations: 3
  scenarios:
    - id: first-frame
      what: 陸地データの取得から初回描画まで
      metrics: [first_frame_ms]
    - id: pan
      what: 60フレームのパン操作中の再描画時間とフレーム間隔
      metrics: [redraw_ms, frame_interval_ms]

datasets:
  bake: [node, examples/maplibre/073-display-a-popup/bake.ts]
  sources:
    - id: ne-110m-land
      origin: https://github.com/nvkelso/natural-earth-vector/tree/master/geojson
      license: Natural Earth パブリックドメイン
  outputs:
    - data/baked/maplibre-073-display-a-popup/land.json
  preparation:
    - Natural Earth 110m 陸地ポリゴンを Web Mercator 座標 [0, 1] に投影して量子化

performance_knowledge:
  - id: canvas-vector-popup-sweetspot
    finding: 単一ポップアップの描画において、DOM オーバーレイではなく Canvas 2D 内で角丸吹き出しパスとテキストを一体描画することで、DOM 再レイアウトの同期ズレやガタつきを完全に排除できる
    evidence: 再描画時間は p95 0.3 ms 未満、パン操作時もポップアップと地図が 1 ピクセルもズレずに同期
    applies_when: 固定またはアンカー付きポップアップの軽量描画
  - id: integrated-hit-test
    finding: 閉じるボタンのヒット判定をスクリーン座標計算から直接行うことで、余分な DOM イベント階層を不要化
    evidence: イベントリスナー登録数を最小限に抑制

architecture_selection:
  chosen:
    platform: browser
    api: Canvas 2D
    language: TypeScript (型ストリップ配信)
    gpu: none
    code:
      - examples/maplibre/073-display-a-popup/index.html
      - examples/maplibre/073-display-a-popup/main.ts
      - examples/maplibre/073-display-a-popup/popup.ts
    dependencies: []
    why: 吹き出しポップアップと背景陸地を Canvas 2D で一括描画することで、DOM 同期遅延のない滑らかな追従と最小サイズを実現
  alternatives:
    - option: DOM Popup (HTML/CSS オーバーレイ)
      rejected_because: ドラッグ移動時の translate3d 同期によるレイアウトシフトや 1 フレーム遅れのジッターを避けるため
    - option: WebGL2
      rejected_because: テキスト描画用 SDF アトラスや吹き出し三角形メッシュの生成が必要になり、コードサイズが増大するため
  not_doing: [3D地形, 地名ラベル, 複数ポップアップの自動衝突回避, 回転・ピッチ, ベクタータイルデコード]

verification:
  checks:
    - id: popup-visible-at-target
      what: 指定座標 [-96, 37.8] 上部に白色の吹き出しポップアップ（#ffffff）が描画されている
      how: getImageData で吹き出し中心位置のピクセル色を検証
      expected: r > 250 && g > 250 && b > 250 && popupVisible === true
    - id: popup-moves-with-pan
      what: 地図を (50px, 30px) パンしたとき、ポップアップの描画位置が正確に (+50px, +30px) 移動する
      how: パン後の移動先ピクセルの色を検証
      expected: 移動先で白色ピクセルが検出される
    - id: popup-close-and-reopen
      what: ポップアップを非表示にしたとき背景陸地に戻り、再表示したとき白色吹き出しが復帰する
      how: 非表示時・再表示時のピクセル色を検証
      expected: 非表示時 notWhite && 再表示時 isWhite
    - id: popup-anchors-on-zoom
      what: ズームを4に変更してもポップアップの先端が指定座標に正確に追従する
      how: ズーム変更後のピクセル色を検証
      expected: ズーム後も計算されたスクリーン座標に白色吹き出しが描画されている
  harness:
    - contextlost が起きたらエラーにする
