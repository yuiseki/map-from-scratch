<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MapLibre: Display a map</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #aad3df; font-family: system-ui, sans-serif; }
    #map { width: 100%; height: 100%; display: block; cursor: grab; }
    #map:active { cursor: grabbing; }
    .panel {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(255, 255, 255, 0.94);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }
    .panel b { color: #1f3a52; font-size: 14px; }
    .nav-controls {
      position: absolute;
      top: 12px;
      right: 12px;
      background: #fff;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 10;
    }
    .nav-controls button {
      width: 32px;
      height: 32px;
      border: none;
      background: #fff;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      color: #333;
      border-bottom: 1px solid #eee;
    }
    .nav-controls button:last-child { border-bottom: none; }
    .nav-controls button:hover { background: #f0f0f0; }
  </style>
</head>
<body>
  <canvas id="map"></canvas>
  <div class="panel">
    <div><b>MapLibre 069</b>: Display a map (center: [0, 0], zoom: 1)</div>
  </div>
  <div class="nav-controls">
    <button id="zoom-in" title="Zoom in">+</button>
    <button id="zoom-out" title="Zoom out">−</button>
    <button id="reset-btn" title="Reset view" style="font-size: 11px;">↺</button>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
