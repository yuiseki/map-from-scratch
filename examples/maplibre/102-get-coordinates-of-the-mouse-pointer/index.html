<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MapLibre: Get coordinates of the mouse pointer</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #aad3df; font-family: system-ui, sans-serif; }
    #map { width: 100%; height: 100%; display: block; cursor: crosshair; }
    #map:active { cursor: grabbing; }
    .panel {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(255, 255, 255, 0.94);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      z-index: 10;
      max-width: 320px;
    }
    .panel b { color: #1f3a52; font-size: 14px; }
    #info {
      margin-top: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      color: #1f3a52;
      background: #eef4f8;
      border-radius: 4px;
      padding: 4px 8px;
      min-height: 30px;
      white-space: pre-line;
    }
    .hint { color: #667; font-size: 11px; margin-top: 6px; }
  </style>
</head>
<body>
  <canvas id="map"></canvas>
  <div class="panel">
    <div><b>MapLibre 102</b>: Get coordinates of the mouse pointer</div>
    <div id="info">Move the pointer over the map</div>
    <div class="hint">Crosshair: pointer position. Drag to pan, wheel to zoom. Land: Natural Earth.</div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
