<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MapLibre - Display buildings in 3D</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #d8e6eb;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #info {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 6px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: #222;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="info">
    <strong>MapLibre GL JS - Display buildings in 3D</strong><br />
    3D extruded building prisms with directional sun lighting & pitch controls.<br />
    Drag to rotate / pitch, scroll to zoom.
  </div>
  <canvas id="map"></canvas>
  <script type="module" src="./main.js"></script>
</body>
</html>
