<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MapLibre GL JS - Animate map camera around a point</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #e0f2fe; }
    #map-canvas { width: 100vw; height: 100vh; display: block; }
    #overlay {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(4px);
      padding: 12px 16px;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      font-size: 13px;
      color: #334155;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 10;
    }
    .title { font-weight: 600; color: #0f172a; font-size: 14px; }
    .status { font-size: 12px; color: #64748b; font-family: monospace; }
    .controls { display: flex; gap: 8px; margin-top: 6px; }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div id="overlay">
    <div class="title">Animate camera around a point</div>
    <div class="status" id="bearing-display">Bearing: 0.0°</div>
    <div class="controls">
      <button id="btn-toggle">Pause</button>
      <button id="btn-reset">Reset</button>
    </div>
  </div>
  <canvas id="map-canvas"></canvas>
  <script type="module" src="./main.ts"></script>
</body>
</html>
