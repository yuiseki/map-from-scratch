<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>世界の地表気温等値帯 · D3 GeoTIFF contours</title>
<style>
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#132132; color:#ecf2f7; font:14px/1.5 system-ui,sans-serif }
  canvas { display:block; width:100vw; height:100vh }
  .panel { position:fixed; top:16px; left:16px; width:min(300px,calc(100% - 32px)); padding:14px; border:1px solid #596b7d; border-radius:12px; background:#132132ec; box-shadow:0 8px 24px #0007 }
  h1 { margin:0 0 6px; font-size:17px }
  p { margin:5px 0 }
  label { display:block; margin-top:9px }
  input { width:100%; accent-color:#f58b42 }
  footer { position:fixed; bottom:8px; right:8px; max-width:min(530px,calc(100% - 20px)); padding:5px 8px; background:#132132e9; border-radius:5px; font-size:11px }
  a { color:#addcff }
</style>
<canvas id="map" aria-label="世界の地表気温を等値帯で示す地図"></canvas>
<div class="panel">
  <h1>世界の地表気温等値帯</h1>
  <p>2016年8月2日の地表気温予報。Natural Earth 投影で表示します。</p>
  <label for="step">等値帯の間隔 <strong id="step-value">5 °C</strong></label>
  <input id="step" type="range" min="2" max="12" step="1" value="5">
  <p id="status">読み込み中…</p>
</div>
<footer>データ: <a href="https://observablehq.com/@d3/geotiff-contours-ii">D3 GeoTIFF contours</a> の GeoTIFF 添付ファイルから変換。原ファイルの GRIB メタデータは地表気温予報を示します。加工表示です。</footer>
<script type="module" src="./main.js"></script>
