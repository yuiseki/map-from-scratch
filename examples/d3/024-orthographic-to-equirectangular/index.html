<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>D3 · Orthographic → equirectangular</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #030916; color: #edf6ff; font: 14px/1.5 system-ui, sans-serif; }
    #map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .panel { position: absolute; left: 22px; top: 22px; width: min(390px, calc(100vw - 44px)); padding: 17px 20px; border: 1px solid #ffffff26; border-radius: 13px; background: #071525dc; box-shadow: 0 16px 48px #0008; backdrop-filter: blur(14px); }
    .eyebrow { color: #6dd6d0; text-transform: uppercase; letter-spacing: .18em; font-size: 10px; font-weight: 700; }
    h1 { margin: 5px 0 7px; font-size: 20px; line-height: 1.2; }
    p { margin: 0; color: #a9bfd0; font-size: 12px; }
    .row { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
    input[type=range] { width: 100%; accent-color: #65d9cd; }
    button { border: 1px solid #4c8290; border-radius: 7px; padding: 6px 10px; color: #e9fcff; background: #103345; cursor: pointer; }
    .labels { position: absolute; bottom: 20px; left: 22px; color: #8ba3b4; font-size: 11px; letter-spacing: .08em; }
    .labels.right { left: auto; right: 22px; }
  </style>
</head>
<body>
  <canvas id="map" aria-label="WebGL2 3D 地球儀"></canvas>
  <section class="panel">
    <div class="eyebrow">D3 / Observable · 3D reimplementation</div>
    <h1>Unfold the globe</h1>
    <p>Natural Earth land · WebGL2 · drag / animation</p>
    <div class="row"><span>GLOBE</span><input id="morph" aria-label="投影の変形" type="range" min="0" max="1" step="0.001" value="0"><span>MAP</span></div>
  </section>
  <div class="labels">EARTH · NATURAL EARTH 110m</div>
  <script type="module" src="./main.js"></script>
</body>
</html>
