<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>D3: Web Mercator tile grid</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #e9eef2; font-family: system-ui, sans-serif; }
    #map { width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
    .bar { position: absolute; top: 12px; left: 12px; display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.92); color: #1f2937; padding: 6px 10px; border-radius: 8px; font-size: 13px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
    .bar .hint { color: #64748b; }
    .bar .addr { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: #1e3a8a; color: #fff; padding: 2px 8px; border-radius: 5px; }
    .attr { position: absolute; right: 6px; bottom: 4px; background: rgba(255,255,255,0.82); color: #334155; font-size: 11px; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <canvas id="map"></canvas>
  <div class="bar">
    <b>d3 010</b>
    <span class="addr" id="addr">z/x/y</span>
    <span class="hint">drag to pan · wheel to zoom</span>
  </div>
  <div class="attr" id="attr"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
