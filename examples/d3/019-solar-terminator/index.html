<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>D3: Solar terminator</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #a9d3ea; font-family: system-ui, sans-serif; }
    #map { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
    #map:active { cursor: grabbing; }
    .panel {
      position: absolute;
      top: 12px;
      left: 12px;
      width: min(360px, calc(100% - 40px));
      background: rgba(12, 18, 36, 0.9);
      color: #e5edf7;
      padding: 12px 15px;
      border-radius: 8px;
      font-size: 13px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      z-index: 10;
    }
    .panel b { color: #ffd166; font-size: 14px; }
    #readout { margin-top: 6px; font-size: 12px; color: #b8c7dc; }
    .row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    input[type=range] { flex: 1; accent-color: #ffd166; }
    button {
      border: 1px solid #46608a;
      background: #1e2c4a;
      color: #e5edf7;
      border-radius: 5px;
      padding: 4px 9px;
      font-size: 12px;
      cursor: pointer;
    }
    .legend { display: flex; gap: 12px; margin-top: 8px; font-size: 11px; color: #b8c7dc; }
    .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  </style>
</head>
<body>
  <canvas id="map" aria-label="太陽直下点と昼夜の境界を示す世界地図"></canvas>
  <div class="panel">
    <div><b>D3 019</b>: solar terminator</div>
    <div id="readout">読み込み中…</div>
    <div class="row">
      <input id="hour" type="range" min="0" max="24" step="0.25" value="12" aria-label="UTC 時刻">
      <button id="play">日周運動を再生</button>
    </div>
    <div class="legend">
      <span><i class="swatch" style="background:#f2efe9"></i>昼</span>
      <span><i class="swatch" style="background:#2c3555"></i>夜</span>
      <span><i class="swatch" style="background:#ffd166; border-radius: 50%"></i>太陽直下点</span>
    </div>
    <div style="margin-top: 6px; font-size: 11px; color: #8fa2bd;">ドラッグで移動、ホイールで拡大・縮小</div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
