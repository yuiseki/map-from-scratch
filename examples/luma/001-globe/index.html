<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>luma-001-globe — 3D Earth Globe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #03050a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #canvas { width: 100%; height: 100%; display: block; }
    .overlay {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(8, 14, 26, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 16px;
      color: #fff;
      max-width: 320px;
      pointer-events: auto;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    h1 { font-size: 16px; margin-bottom: 6px; font-weight: 600; color: #60a5fa; }
    p { font-size: 12px; color: #94a3b8; line-height: 1.4; margin-bottom: 12px; }
    .controls { display: flex; flex-direction: column; gap: 8px; font-size: 12px; }
    .control-row { display: flex; justify-content: space-between; align-items: center; }
    label { color: #cbd5e1; }
    input[type="range"] { accent-color: #3b82f6; width: 130px; }
    .stats { margin-top: 10px; font-size: 11px; color: #64748b; border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 8px; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="overlay">
    <h1>luma.gl 3D Earth Globe</h1>
    <p>3D photorealistic sphere, solar terminator lighting, atmospheric Rayleigh rim glow, ocean sun glint & nocturnal city lights.</p>
    <div class="controls">
      <div class="control-row">
        <label for="autoRotate">Auto-Rotate</label>
        <input type="checkbox" id="autoRotate" checked>
      </div>
      <div class="control-row">
        <label for="sunAngle">Sun Angle</label>
        <input type="range" id="sunAngle" min="0" max="6.28" step="0.05" value="1.2">
      </div>
      <div class="control-row">
        <label for="distance">Distance</label>
        <input type="range" id="distance" min="1.5" max="5.0" step="0.1" value="2.6">
      </div>
    </div>
    <div class="stats">
      <span>Drag to orbit • Wheel to zoom</span>
      <div id="fps">FPS: --</div>
    </div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
