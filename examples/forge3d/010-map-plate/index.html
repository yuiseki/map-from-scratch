<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>forge3d: Map plate</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #e5e3dc; font-family: system-ui, sans-serif; }
    #map { width: 100%; height: 100%; display: block; cursor: grab; }
    #map:active { cursor: grabbing; }
    .panel {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(248, 246, 240, 0.95);
      border: 1px solid #1a202c;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
      color: #1a202c;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      z-index: 10;
    }
    .panel b { font-size: 13px; }
  </style>
</head>
<body>
  <canvas id="map"></canvas>
  <div class="panel">
    <div><b>forge3d 010</b>: Map Plate</div>
    <div style="font-size: 11px; color: #4a5568;">Cartographic layout &amp; Mt. Rainier mini DEM</div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
