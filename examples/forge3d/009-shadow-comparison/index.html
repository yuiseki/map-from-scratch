<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>forge3d: Shadow comparison</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1220; font-family: system-ui, sans-serif; }
    #map { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
    #map:active { cursor: grabbing; }
    .panel {
      position: absolute; top: 12px; left: 12px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.35);
      padding: 10px 14px; border-radius: 8px; font-size: 13px; color: #e2e8f0;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      display: flex; flex-direction: column; gap: 6px; z-index: 10;
    }
    .panel b { color: #4ade80; font-size: 14px; }
    .panel .sub { font-size: 11px; color: #94a3b8; }
    .split { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
    .split input { width: 170px; accent-color: #4ade80; }
    .split output { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: #4ade80; min-width: 36px; }
    .attr { position: absolute; right: 6px; bottom: 4px; background: rgba(15,23,42,0.78); color: #94a3b8; font-size: 11px; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <canvas id="map"></canvas>
  <div class="panel">
    <div><b>forge3d 009</b>: Shadow comparison</div>
    <div class="sub">Mt. Rainier 200x200 DEM · sun NW 315°, 45°</div>
    <div class="split">
      <span class="sub">split</span>
      <input id="split" type="range" min="0" max="100" step="1" value="50">
      <output id="splitOut">50%</output>
    </div>
  </div>
  <div class="attr">Elevation: USGS 3DEP via Mapzen Terrarium (public domain)</div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
