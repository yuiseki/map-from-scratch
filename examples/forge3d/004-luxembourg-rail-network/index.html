<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>forge3d: Luxembourg Rail Network</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #141a22; font-family: system-ui, sans-serif; }
    #map { width: 100%; height: 100%; display: block; cursor: grab; }
    #map:active { cursor: grabbing; }
    .panel {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(20, 26, 34, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 10;
    }
    .panel b { color: #ff7043; font-size: 14px; }
    .legend { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    .legend-line { width: 18px; height: 3px; background: #ff6e40; box-shadow: 0 0 6px #ff5722; display: inline-block; }
  </style>
</head>
<body>
  <canvas id="map"></canvas>
  <div class="panel">
    <div><b>forge3d 004</b>: Luxembourg Rail Network</div>
    <div class="legend"><span class="legend-line"></span> CFL Railway lines (glowing overlay)</div>
    <div style="font-size: 11px; color: #90a4ae;">Drag to pan • Wheel to zoom</div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
