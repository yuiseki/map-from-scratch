<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>forge3d: Point cloud</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0f1d; font-family: system-ui, sans-serif; }
    #map { width: 100%; height: 100%; display: block; cursor: grab; }
    #map:active { cursor: grabbing; }
    .panel {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(10, 15, 29, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.3);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      color: #e2e8f0;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 10;
    }
    .panel b { color: #f1f5f9; font-size: 14px; }
    .ramp {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 4px;
    }
    .ramp-bar {
      width: 160px;
      height: 8px;
      border-radius: 4px;
      background: linear-gradient(to right, #2d5a3f, #4d7c49, #7d8c54, #9a8b75, #b87352, #8f98a3, #b4c0cf, #f1f5f9);
    }
    .ramp-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <canvas id="map"></canvas>
  <div class="panel">
    <div><b>forge3d 006</b>: Point Cloud</div>
    <div style="font-size: 11px; color: #94a3b8;">10,000 LiDAR points (Mt. St. Helens caldera)</div>
    <div class="ramp">
      <div class="ramp-bar"></div>
      <div class="ramp-labels">
        <span>Valley</span>
        <span>Lava Dome</span>
        <span>Summit Rim</span>
      </div>
    </div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
