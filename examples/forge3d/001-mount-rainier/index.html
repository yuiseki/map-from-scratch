<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>forge3d: Mount Rainier 3D</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1220; font-family: system-ui, sans-serif; }
    /* The sky lives behind a transparent WebGL canvas, so it costs no shader. */
    #map {
      width: 100%; height: 100%; display: block; cursor: grab; touch-action: none;
      background: linear-gradient(#1d4e89 0%, #5d93c9 38%, #a9c9e6 66%, #dfeaf5 100%);
    }
    #map:active { cursor: grabbing; }
    .panel {
      position: absolute; top: 12px; left: 12px;
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(148, 163, 184, 0.35);
      padding: 10px 14px; border-radius: 8px; font-size: 13px; color: #e2e8f0;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      display: flex; flex-direction: column; gap: 6px; z-index: 10;
    }
    .panel b { color: #a7f3d0; font-size: 14px; }
    .panel .sub { font-size: 11px; color: #94a3b8; }
    .panel output { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: #a7f3d0; }
    .attr { position: absolute; right: 6px; bottom: 4px; background: rgba(15,23,42,0.72); color: #cbd5e1; font-size: 11px; padding: 2px 6px; border-radius: 4px; }
    .error { position: absolute; bottom: 8px; left: 8px; color: #fecaca; font-size: 12px; max-width: 70%; }
  </style>
</head>
<body>
  <canvas id="map"></canvas>
  <div class="panel">
    <div><b>forge3d 001</b>: Mount Rainier</div>
    <div class="sub">384x384 DEM · sun NW 302°, 24° · drag to orbit, wheel to zoom</div>
    <output id="camera">az 49° · el 28° · r 6.0 km</output>
  </div>
  <div class="attr">Elevation: USGS 3DEP via Mapzen Terrarium (public domain)</div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
