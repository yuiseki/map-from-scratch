<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>forge3d: Mount Fuji labels</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1220; font-family: system-ui, sans-serif; }
    /* The sky lives behind a transparent WebGL canvas, so it costs no shader. */
    #map {
      position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none;
      background: linear-gradient(#3b6fa8 0%, #7aa7d4 40%, #b9d3ea 70%, #e4eef7 100%);
    }
    #map:active { cursor: grabbing; }
    /* Labels are drawn on a 2D canvas above; it lets the pointer through. */
    #labels { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .panel {
      position: absolute; top: 12px; left: 12px;
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(148, 163, 184, 0.35);
      padding: 10px 14px; border-radius: 8px; font-size: 13px; color: #e2e8f0;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      display: flex; flex-direction: column; gap: 6px; z-index: 10; max-width: calc(100% - 52px);
    }
    .panel b { color: #a7f3d0; font-size: 14px; }
    .panel .sub { font-size: 11px; color: #94a3b8; }
    .panel output { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: #a7f3d0; }
    .attr { position: absolute; right: 6px; bottom: 4px; background: rgba(15,23,42,0.72); color: #cbd5e1; font-size: 11px; padding: 2px 6px; border-radius: 4px; }
    .error { position: absolute; bottom: 8px; left: 8px; color: #fecaca; font-size: 12px; max-width: 70%; }
  </style>
</head>
<body>
  <canvas id="map"></canvas>
  <canvas id="labels"></canvas>
  <div class="panel">
    <div><b>forge3d 002</b>: Mount Fuji labels</div>
    <div class="sub">40 placenames · hidden behind the mountain or each other · drag to orbit, wheel to zoom</div>
    <output id="camera">az 18° · el 36° · r 26.0 km</output>
  </div>
  <div class="attr">Elevation: Mapzen Terrarium (AWS Open Data) · Places © OpenStreetMap contributors (ODbL), via forge3d</div>
  <script type="module" src="./main.js"></script>
</body>
</html>
