<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英国の交通事故・3D六角集計</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #0b131c; color: #e6eff5; font: 14px/1.5 system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .panel { position: fixed; top: 14px; left: 14px; width: min(350px, calc(100% - 28px)); padding: 15px; border: 1px solid #385467; border-radius: 12px; background: #102330e8; box-shadow: 0 8px 24px #0006; }
  h1 { font-size: 17px; margin: 0 0 5px; }
  p { margin: 5px 0; }
  label { display: block; margin-top: 10px; }
  input { width: 100%; accent-color: #ef7d42; }
  small { color: #bfd0da; }
  #tooltip { position: fixed; display: none; padding: 5px 8px; border-radius: 5px; background: #102330f0; pointer-events: none; }
  footer { position: fixed; bottom: 10px; right: 10px; max-width: min(450px, calc(100% - 20px)); padding: 5px 8px; border-radius: 5px; background: #102330e8; font-size: 11px; }
  a { color: #addcff; }
</style>
<canvas id="map" aria-label="英国の交通事故を3D六角柱で集計した地図"></canvas>
<div class="panel">
  <h1>英国の交通事故・3D六角集計</h1>
  <p id="status">読み込み中…</p>
  <label for="radius">集計半径 <strong id="radius-value">2,000 m</strong></label>
  <input id="radius" type="range" min="500" max="6000" step="250" value="2000">
  <label for="coverage">列の幅 <strong id="coverage-value">0.7</strong></label>
  <input id="coverage" type="range" min="20" max="100" value="70">
  <label for="percentile">上位分位 <strong id="percentile-value">100%</strong></label>
  <input id="percentile" type="range" min="50" max="100" value="100">
  <small>ドラッグで移動、Shift＋ドラッグで回転・傾斜、ホイールで拡大・縮小</small>
</div>
<div id="tooltip"></div>
<footer>データ: <a href="https://github.com/visgl/deck.gl-data/tree/master/examples/3d-heatmap">deck.gl-data</a> / <a href="https://www.data.gov.uk/dataset/cb7ae6f0-4be6-4935-9277-47e5ce24a11f/road-accidents-safety-data">Department for Transport・UK OGL</a></footer>
<script type="module" src="./main.js"></script>
