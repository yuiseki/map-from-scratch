<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>deck.gl: ScatterplotLayer</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1020; font-family: system-ui, sans-serif; }
    #map { width: 100%; height: 100%; display: block; cursor: grab; }
    #map:active { cursor: grabbing; }
    .panel {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(16, 24, 44, 0.92);
      color: #e6ecf7;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      z-index: 10;
    }
    .panel b { color: #8fd0ff; font-size: 14px; }
    .panel small { color: #9fb0c8; }
  </style>
</head>
<body>
  <canvas id="map"></canvas>
  <div class="panel">
    <div><b>deck.gl 016</b>: ScatterplotLayer (Manhattan)</div>
    <small>13,987 points · weight 1 blue, 2 orange · drag to pan, wheel to zoom</small>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
