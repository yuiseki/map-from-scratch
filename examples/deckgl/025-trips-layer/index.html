<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マンハッタンのタクシー移動履歴</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #0b131c; color: #e6eff5; font: 14px/1.5 system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .panel { position: fixed; top: 14px; left: 14px; width: min(360px, calc(100% - 28px)); padding: 15px; border: 1px solid #385467; border-radius: 12px; background: #102330e8; box-shadow: 0 8px 24px #0006; }
  h1 { font-size: 17px; margin: 0 0 5px; }
  p { margin: 5px 0; }
  label { display: block; margin-top: 10px; }
  input[type=range] { width: 100%; accent-color: #fa8a5e; }
  button { margin-top: 10px; padding: 6px 12px; border: 1px solid #5d8798; border-radius: 6px; background: #254658; color: white; cursor: pointer; }
  small { display: block; margin-top: 10px; color: #bfd0da; }
  .legend { color: #bfd0da; }
  .yellow { color: #ff8960; } .green { color: #19bcca; }
  footer { position: fixed; bottom: 10px; right: 10px; max-width: min(480px, calc(100% - 20px)); padding: 5px 8px; border-radius: 5px; background: #102330e8; font-size: 11px; }
  a { color: #addcff; }
</style>
<canvas id="map" aria-label="マンハッタンのタクシー移動履歴と建物の3D地図"></canvas>
<div class="panel">
  <h1>マンハッタンのタクシー移動履歴</h1>
  <p id="status">読み込み中…</p>
  <p class="legend"><span class="yellow">● イエローキャブ</span>　<span class="green">● グリーンキャブ</span></p>
  <label for="time">時刻 <strong id="time-value">21:15:00</strong></label>
  <input id="time" type="range" min="0" max="1800" value="900">
  <label for="trail">軌跡の長さ <strong id="trail-value">180 秒</strong></label>
  <input id="trail" type="range" min="30" max="420" step="10" value="180">
  <button id="play" type="button" aria-pressed="true">一時停止</button>
  <small>ドラッグで移動、Shift＋ドラッグで回転・傾斜、ホイールで拡大・縮小</small>
</div>
<footer>データ: <a href="https://github.com/visgl/deck.gl-data/tree/master/examples/trips">deck.gl-data</a> / <a href="https://www.nyc.gov/site/tlc/about/tlc-trip-record-data.page">NYC TLC</a> / © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a></footer>
<script type="module" src="./main.ts"></script>
