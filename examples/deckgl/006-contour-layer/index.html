<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>米国の週別COVID-19等値帯</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #102a3b; color: #eaf4fa; font: 14px/1.5 system-ui, sans-serif; }
  #land, #map { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  #land { pointer-events: none; }
  #map { touch-action: none; }
  .panel { position: fixed; top: 14px; left: 14px; width: min(330px, calc(100% - 28px)); padding: 14px; border: 1px solid #456879; border-radius: 12px; background: #102838e9; box-shadow: 0 8px 24px #0007; }
  h1 { font-size: 17px; margin: 0 0 5px; }
  p { margin: 5px 0; }
  label { display: block; margin-top: 9px; }
  input[type=range], select { width: 100%; accent-color: #f68b4d; }
  select { margin-top: 3px; padding: 6px; background: #213e4c; color: white; border: 1px solid #56788a; border-radius: 5px; }
  .legend { display: flex; margin: 10px 0 2px; height: 18px; border-radius: 4px; overflow: hidden; }
  .legend span { flex: 1; }
  .key { display: flex; justify-content: space-between; color: #c9dbe4; font-size: 11px; }
  small { display: block; margin-top: 8px; color: #c9dbe4; }
  #tooltip { position: fixed; display: none; padding: 5px 8px; border-radius: 5px; background: #102838f0; pointer-events: none; }
  footer { position: fixed; bottom: 10px; right: 10px; max-width: min(480px, calc(100% - 20px)); padding: 5px 8px; border-radius: 5px; background: #102838e8; font-size: 11px; }
  a { color: #b0e0ff; }
</style>
<canvas id="land" aria-hidden="true"></canvas>
<canvas id="map" aria-label="米国の郡別COVID-19新規感染者率を等値帯で示す地図"></canvas>
<div class="panel">
  <h1>米国の週別COVID-19等値帯</h1>
  <p id="status">読み込み中…</p>
  <p>新規感染者数 / 人口10万人。セル内の郡の最大値を表示します。</p>
  <label for="style">表示方式</label>
  <select id="style"><option value="bands">等値帯</option><option value="lines">等値線</option></select>
  <label for="cell">集計セル <strong id="cell-value">60 km</strong></label>
  <input id="cell" type="range" min="20000" max="120000" step="10000" value="60000">
  <label for="week">週 <strong id="week-value">2020-08-17</strong></label>
  <input id="week" type="range" min="0" max="86" value="30">
  <div class="legend"><span style="background:#ffffb2"></span><span style="background:#fecc5c"></span><span style="background:#fd8d3c"></span><span style="background:#f03b20"></span><span style="background:#bd0026"></span><span style="background:#9f0050"></span></div>
  <div class="key"><span>0.1</span><span>1</span><span>10</span><span>100</span><span>500</span><span>2000+</span></div>
  <small>ドラッグで移動、ホイールで拡大・縮小</small>
</div>
<div id="tooltip"></div>
<footer>データ: <a href="https://github.com/nytimes/covid-19-data">The New York Times</a>（非商用・帰属表示条件）/ <a href="https://github.com/visgl/deck.gl-data/tree/master/examples/contour">deck.gl-data</a> · 陸地: <a href="https://www.naturalearthdata.com/">Natural Earth</a></footer>
<script type="module" src="./main.js"></script>
