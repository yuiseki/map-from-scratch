<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>バンクーバーの土地評価額 3D</title>
<style>
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#bfd4e1; color:#16303a; font:14px/1.5 system-ui,sans-serif }
  canvas { display:block; width:100vw; height:100vh; touch-action:none; cursor:grab }
  canvas:active { cursor:grabbing }
  .panel { position:fixed; top:14px; left:14px; width:min(330px,calc(100% - 28px)); padding:14px; border:1px solid #8fa9ae; border-radius:12px; background:#f3f8f3ea; box-shadow:0 8px 24px #2030405c }
  h1 { margin:0 0 5px; font-size:17px }
  p { margin:5px 0 }
  .legend { height:14px; margin:10px 0 4px; border-radius:4px; background:linear-gradient(90deg,#41b6c4,#c7e9b4,#ffffcc,#feb24c,#fc4e2a,#800026) }
  .key { display:flex; justify-content:space-between; font-size:11px }
  small { display:block; margin-top:9px }
  #tooltip { position:fixed; display:none; pointer-events:none; padding:7px 9px; background:#f3f8f3f0; border:1px solid #8fa9ae; border-radius:6px; box-shadow:0 4px 10px #0003 }
  footer { position:fixed; right:8px; bottom:8px; max-width:min(520px,calc(100% - 16px)); padding:5px 8px; background:#f3f8f3ed; border-radius:5px; font-size:11px }
  a { color:#115584 }
</style>
<canvas id="map" aria-label="バンクーバーの土地評価額と伸び率を3D区画で示す地図"></canvas>
<div class="panel">
  <h1>バンクーバーの土地評価額 3D</h1>
  <p id="status">読み込み中…</p>
  <p>高さ: 土地面積あたり平均評価額の平方根。色: 前回評価からの伸び率。</p>
  <div class="legend"></div><div class="key"><span>−60%</span><span>0%</span><span>+60%</span><span>+120%</span></div>
  <small>ドラッグで移動、右ドラッグか Shift＋ドラッグで回転、ホイールで拡大・縮小。区画に重ねると数値を表示します。</small>
</div>
<div id="tooltip"></div>
