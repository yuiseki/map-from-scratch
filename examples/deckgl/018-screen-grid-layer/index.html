<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NYC Uber 乗車地点・画面格子</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #0b131c; color: #e6eff5; font: 14px/1.5 system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .panel { position: fixed; top: 14px; left: 14px; width: min(340px, calc(100% - 28px)); padding: 15px; border: 1px solid #385467; border-radius: 12px; background: #102330e8; box-shadow: 0 8px 24px #0006; }
  h1 { font-size: 17px; margin: 0 0 5px; }
  p { margin: 5px 0; }
  label { display: block; margin-top: 12px; }
  input { width: 100%; accent-color: #f4a259; }
  small { color: #bfd0da; }
  footer { position: fixed; bottom: 10px; right: 10px; max-width: min(440px, calc(100% - 20px)); padding: 5px 8px; border-radius: 5px; background: #102330e8; font-size: 11px; }
  a { color: #addcff; }
</style>
<canvas id="map" aria-label="ニューヨークの Uber 乗車地点の画面格子地図"></canvas>
<div class="panel">
  <h1>NYC Uber 乗車地点</h1>
  <p id="status">読み込み中…</p>
  <label for="cell-size">セル幅 <strong id="cell-size-value">20 px</strong></label>
  <input id="cell-size" type="range" min="5" max="60" value="20">
  <small>ドラッグで移動、ホイールで拡大・縮小</small>
</div>
<footer>データ: <a href="https://github.com/visgl/deck.gl-data/tree/master/examples/screen-grid">deck.gl-data</a> / <a href="https://github.com/fivethirtyeight/uber-tlc-foil-response">FiveThirtyEight・NYC TLC</a></footer>
<script type="module" src="./main.ts"></script>
