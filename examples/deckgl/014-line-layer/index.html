<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>deck.gl: LineLayer</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1220; font-family: system-ui, sans-serif; }
    #map { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
    #map:active { cursor: grabbing; }
    .info { position: absolute; top: 12px; left: 12px; background: rgba(11,18,32,0.88); color: #e2e8f0; padding: 8px 14px; border-radius: 8px; font-size: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); pointer-events: none; }
    .info b { color: #38bdf8; }
  </style>
</head>
<body>
  <canvas id="map"></canvas>
  <div class="info">
    <b>deck.gl 014</b>: LineLayer (1,500 US county migration pairs: <span style="color:#38bdf8">net eastward</span> / <span style="color:#f59e0b">net westward</span>)
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
