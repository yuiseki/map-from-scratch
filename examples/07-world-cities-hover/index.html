<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>世界の都市</title>
<style>
  html, body { margin: 0; height: 100%; background: #cce0ed; font: 14px/1.4 system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; }
  #tip { position: fixed; left: 0; top: 0; pointer-events: none; padding: 6px 10px; background: #fffe; border-radius: 6px;
         box-shadow: 0 1px 6px #0004; color: #222; white-space: nowrap; }
  #tip:empty { display: none; }
  #key { position: fixed; left: 12px; bottom: 12px; padding: 8px 10px; background: #fffc; border-radius: 6px; color: #444; }
  #key i { box-sizing: border-box; display: inline-block; vertical-align: middle; margin: 0 4px 0 10px; border-radius: 50%; background: #d94d26c0; border: 1px solid #fff; }
</style>
<canvas id="map"></canvas>
<div id="tip"></div>
<div id="key">人口<i style="width:3px;height:3px"></i>10万<i style="width:6px;height:6px"></i>100万<i style="width:19px;height:19px"></i>1000万</div>
<script type="module" src="./main.js"></script>
