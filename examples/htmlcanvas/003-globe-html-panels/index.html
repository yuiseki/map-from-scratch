<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Globe HTML panels — map-from-scratch</title>
  <meta name="description" content="Real, clickable HTML panels drawn into a WebGL2 globe with HTML-in-Canvas.">
  <style>
    :root { color-scheme: dark; font-family: system-ui, 'Noto Sans CJK JP', sans-serif; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050a17; color: #e2e8f0; }
    #scene { position: fixed; inset: 0; touch-action: none; }
    #globe, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
    #overlay { pointer-events: none; overflow: hidden; }
    .panel { position: absolute; left: 0; top: 0; width: 232px; height: 172px; box-sizing: border-box; padding-bottom: 12px;
      font: 13px/1.35 system-ui, 'Noto Sans CJK JP', sans-serif; color: #0f172a; transform-origin: 0 0; }
    #overlay .panel { pointer-events: auto; }
    .card { box-sizing: border-box; height: 160px; padding: 8px 10px; border: 1px solid #94a3b8; border-radius: 10px;
      background: #f8fafc; display: flex; flex-direction: column; gap: 3px; }
    .arrow { position: absolute; left: 108px; bottom: 0; border: 8px solid transparent; border-bottom: 0; border-top: 12px solid #94a3b8; }
    .name { font-size: 16px; font-weight: 700; }
    .en, .country, .src { color: #475569; }
    .src { font-size: 10px; }
    .stat { display: flex; justify-content: space-between; }
    .stat b { font-variant-numeric: tabular-nums; }
    .year-row { display: flex; align-items: center; gap: 6px; }
    .year-row input { flex: 1; margin: 0; accent-color: #2563eb; }
    .year-row output { width: 36px; font-weight: 700; text-align: right; }
    .actions { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
    .bookmark { font: inherit; border: 0; border-radius: 6px; padding: 3px 10px; background: #2563eb; color: #fff; cursor: pointer; }
    .bookmark[aria-pressed="true"] { background: #16a34a; }
    .bookmark:focus-visible, .panel a:focus-visible, .panel input:focus-visible { outline: 3px solid #f59e0b; outline-offset: 1px; }
    .panel a { color: #1d4ed8; }
    header { position: absolute; left: 20px; top: 16px; max-width: 470px; pointer-events: none; text-shadow: 0 1px 8px #000; }
    h1 { margin: 0 0 4px; font-size: 22px; }
    #status { margin: 0; font-size: 12px; color: #86efac; }
    #status.fallback { color: #fbbf24; }
    aside { position: absolute; right: 16px; top: 16px; width: 210px; padding: 10px 12px; border: 1px solid #334155; border-radius: 10px;
      background: #0f172acc; font-size: 12px; }
    aside h2 { margin: 0 0 6px; font-size: 13px; }
    aside ul { margin: 0 0 8px; padding-left: 18px; min-height: 1.3em; }
    aside select { width: 100%; font: inherit; }
    #hint { position: absolute; right: 16px; bottom: 14px; font-size: 12px; color: #94a3b8; }
    #credit { position: absolute; left: 16px; bottom: 12px; max-width: 760px; font-size: 10px; color: #94a3b8; }
    #credit a { color: inherit; }
  </style>
  <script>window.__mfsPageStart = performance.now();</script>
</head>
<body>
  <main id="scene">
    <canvas id="globe" aria-label="都市パネルの立つ地球儀"></canvas>
    <div id="overlay"></div>
    <header><h1>地球儀に立つ HTML パネル</h1><p id="status">読み込み中…</p></header>
    <aside>
      <h2>ブックマーク</h2>
      <ul id="bookmarks"></ul>
      <label>都市へ移動 <select id="goto"></select></label>
    </aside>
    <div id="hint">ドラッグで回転 · ホイールでズーム · Tab でパネル内のボタンへ</div>
    <div id="credit">都市: <a href="https://www.naturalearthdata.com/" target="_blank" rel="noopener">Natural Earth</a> (public domain)、都市圏人口は Natural Earth 収録の
      UN World Urbanization Prospects の値 (推計・予測) · 都市人口率: <a href="https://data.worldbank.org/indicator/SP.URB.TOTL.IN.ZS" target="_blank" rel="noopener">World Bank WDI</a> 2026-10-01 (CC BY 4.0) ·
      地球画像: <a href="https://www.solarsystemscope.com/textures/" target="_blank" rel="noopener">Solar System Scope</a> (CC BY 4.0)</div>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
