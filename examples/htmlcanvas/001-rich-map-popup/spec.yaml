id: htmlcanvas-001-rich-map-popup
request: >-
  地図上の地点をクリックしたときに表示する rich popup を DOM overlay や Canvas 自前描画ではなく、
  HTML-in-Canvas（Chrome 157 で正式リリース、drawElementImage）で実 HTML として Canvas 内に描画・操作できることを検証したい。

requirements:
  - id: native-html-popup
    need: DOM overlay や fillText() による自前再実装を排除し、Canvas 内に実 HTML ポップアップを描画する
    unmeasured: verification checks の html-in-canvas-supported と popup-rendered-on-canvas で確認
  - id: multiline-japanese-layout
    need: 日本語を含む複数行レイアウト・バッジ・CSS 背景・境界線・シャドウをブラウザ HTML エンジンで描画する
    unmeasured: verification checks の popup-rendered-on-canvas で確認
  - id: interactive-button
    need: Canvas 内に描画されたポップアップのボタンが、ブラウザ自身のヒットテストで本物のクリックを受け、状態変化が Canvas ピクセルに反映される
    unmeasured: verification checks の button-hit-where-drawn、button-interactive、button-hit-follows-pan で確認
  - id: geographic-tracking
    need: 地図のパン・ズーム操作時にもポップアップのアンカーが地理座標に追従する
    unmeasured: verification checks の anchor-follows-pan で確認
  - id: light-footprint
    need: 外部ライブラリ依存ゼロで配布コードサイズとデータサイズを最小限に抑える
    rationale: 生 Canvas 2D + WICG HTML-in-Canvas API のみで実装し、コード gzip 7 KB 以下、データ gzip 5 KB 以下
  - id: smooth-interaction
    need: パン・ズーム操作時およびポップアップ更新時に 60 fps で滑らかに再描画される
    rationale: 60 Hz の1フレーム 16.7 ms に対し、再描画時間を 5.0 ms 以下に
  - id: seamlessphoto-basemap
    need: 国土地理院「全国最新写真（シームレス）」の 512px タイルを PMTiles v3 HTTP Range 要求で取得し背景に描画する
    unmeasured: verification checks の aerial-tile-rendered で確認

evaluation:
  budgets:
    - {metric: code_gzip_bytes, max: 9000, unit: B, requirement: light-footprint}
    - {metric: data_gzip_bytes, max: 5000, unit: B, requirement: light-footprint}
    - {metric: first_frame_ms, stat: p50, max: 1500, unit: ms, requirement: light-footprint}
    - {metric: redraw_ms, stat: p95, max: 5.0, unit: ms, requirement: smooth-interaction}
    - {metric: frame_interval_ms, stat: p95, max: 16.7, unit: ms, requirement: smooth-interaction}
  gates: [エラーがない, verification の check がすべて通る]

benchmarks:
  runtime: browser
  page: examples/htmlcanvas/001-rich-map-popup/index.html
  viewport: {width: 1024, height: 768, device_scale_factor: 1, mobile: false}
  cpu_throttle: 1
  iterations: 3
  scenarios:
    - id: first-frame
      what: 初期化から初回 HTML-in-Canvas ポップアップ描画まで
      metrics: [first_frame_ms]
    - id: pan
      what: 60 フレームのパン。1 フレームは canvas の paint イベントで描く (drawElementImage がそれを要る) ので、redraw_ms はパンからそのフレームを描き終えるまで、frame_interval_ms は描き終わりどうしの間隔
      metrics: [redraw_ms, frame_interval_ms]

datasets:
  bake: [node, examples/htmlcanvas/001-rich-map-popup/bake.ts]
  sources:
    - id: tokyo-landmarks
      origin: 東京都心主要ランドマーク 5 地点
      license: Public Domain / Open Data
    - id: gsi-seamlessphoto-mirror
      origin: https://z.yuiseki.net/static/gsi/seamlessphoto/seamlessphoto512.pmtiles
      license: >-
        国土地理院コンテンツ利用規約。全国最新写真（シームレス）は他機関の画像も含むため、
        地理院タイル一覧の備考と利用上の注意を確認する。
  outputs:
    - data/baked/htmlcanvas-001-rich-map-popup/landmarks.json

performance_knowledge:
  - what: HTML-in-Canvas (CanvasDrawElement) vs Canvas 自前描画 vs DOM Overlay
    why: >-
      従来の地図ポップアップ実装には2つの極端な手法しかなかった:
      1. DOM Overlay: HTML/CSS でリッチな UI を構築できるが、Canvas の外側に独立した DOM ツリーが浮くため、
         パン・ズーム時に Canvas カメラ描画と DOM transform 更新の間で 1 フレームのズレ（jitter/desync）が発生し、
         さらに Canvas を画像として保存・エクスポートする際にポップアップが含まれない。
      2. Canvas 自前描画: fillText() や自前矩形描画でポップアップを再実装する。しかし日本語の禁則処理・折り返し・
         フォントメトリクス・角丸クリッピング・シャドウ・ボタンの hover/active 状態をすべて自前で計算する必要があり、
         コード量が肥大化しレイアウトが破綻しやすい。
      HTML-in-Canvas（<canvas content="drawable"> + ctx.drawElementImage、Chrome 157）は、ブラウザネイティブの HTML/CSS レイアウト・
      タイポグラフィエンジンをそのまま使って Canvas 内部のピクセルバッファに直接描画できる。
      これにより、コード量を劇的に削減しながら、完全同期・エクスポート可能・ピクセル読み戻し検証可能なリッチ UI が実現する。
  - what: requestPaint と paint イベントによる非同期同期化
    why: >-
      HTML 要素の内容やスタイルが更新された直後は、ブラウザのスタイル計算とレイアウト記録が未完了であるため、
      即座に drawElementImage() を呼ぶと `InvalidStateError: No cached paint record for element` が発生する。
      canvas.requestPaint() を発行し、paint イベントの中で drawElementImage() を呼ぶ。paint イベントは
      ポップアップの見た目が変わったとき (hover、focus) にも自分で来るので、1 フレームを描く関数をそのまま listener にする。

  - id: chrome-157-shipped-api
    finding: >-
      Chrome 157 の正式版では layoutsubtree 属性が無くなり (canvas に layoutSubtree プロパティが無い)、<canvas content="drawable"> と
      子の drawable 属性だけで描ける。機能の有無は canvas.content === 'drawable' で見る (メソッド名は drawElement、drawHTMLElement、
      drawElementImage と変わってきたので、名前で見ない)。2D の drawElementImage は undefined を返し、要素のヒットテストの箱を描いた位置へ
      自分で動かす。だからボタンの矩形と指の位置を自前で比べて click() を呼ぶ処理を消し、ポップアップから canvas へ泡立つ pointerdown を
      地図の操作から外すだけにした
    evidence: >-
      2026-11-06、Chrome for Testing 157.0.8103.38 (フラグなし) の bench で、描いたボタンの中心の elementFromPoint がボタンを返し、
      地図の隅は canvas を返し、120, 80 px のパンの後は新しい位置でボタン、元の位置ではボタン以外を返した (3 回とも)。
      redraw_ms p50 0.945 ms、p95 3.485 ms (3 回 × 60 フレーム)、first_frame_ms p50 49 ms
    applies_when: 2D の canvas に HTML-in-Canvas で操作できる UI を描くとき

  - id: dom-overlay-fallback
    finding: >-
      HTML-in-Canvas の無いブラウザでは canvas の子はフォールバックの中身で、描かれない。ポップアップを canvas の外へ出し、
      同じ矩形へ CSS transform で置く。WebKit は 2026-08 に support とする旨を書いたが、Firefox の立場は出ていない (2026-11-06 時点)
    evidence: main.ts と map.ts の htmlInCanvas が false の経路。HUD がどちらで動いているかを出す
    applies_when: 正式リリース直後の機能を、対応していないブラウザでも使える形で出すとき

  - id: write-the-dom-only-when-it-changes
    finding: textContent は同じ文字列でも代入するとテキストノードを置き換え、ポップアップを組み直す。パンでは何も変わらないので、変わったときだけ書くと 1 フレームが 4 分の 1 になる
    evidence: >-
      RTX 3060 のホストの headless Chromium (2026-11-03)、画面のタイルがそろってからの 60 フレームのパンを 2 回ずつ交互に。毎回書く版は redraw_ms p50 1.6〜2.0 ms、
      p95 2.76〜2.93 ms、変わったときだけ書く版は p50 0.39〜0.42 ms、p95 0.77〜0.84 ms。直前のズームの検査でタイルを読み直している間に測ると、
      drawImage が省かれて軽いフレームになるので、waitForView で画面のタイルを待ってから測る。以前の計測は、何も描かずに rAF を待つ 15 回と、同じ視点を描き直す 20 回で、
      パンを測っていなかった (予算も redraw 8 ms、フレーム間隔 35 ms に緩めてあった)
    applies_when: HTML-in-Canvas で DOM をキャンバスに描き、地図の操作ごとに描き直すとき

architecture_selection:
  chosen:
    language: TypeScript (erasableSyntaxOnly)
    runtime: browser
    api: Canvas 2D + HTML-in-Canvas (drawElementImage, Chrome 157)
    gpu: none
    code:
      - examples/htmlcanvas/001-rich-map-popup/index.html
      - examples/htmlcanvas/001-rich-map-popup/main.ts
      - examples/htmlcanvas/001-rich-map-popup/map.ts
      - examples/htmlcanvas/001-rich-map-popup/support.ts
      - examples/htmlcanvas/001-rich-map-popup/pmtiles.ts
  not_doing:
    - DOM overlay を主経路にすること (ジッターと合成ズレを避ける。HTML-in-Canvas の無いブラウザのフォールバックとしてだけ使う)
    - Canvas fillText / roundRect による UI の自前再実装 (自前レイアウトエンジンの肥大化を排除)
    - 外部地図エンジンや UI フレームワーク（MapLibre, React, Vue, D3 等）の使用

verification:
  checks:
    - id: html-in-canvas-supported
      what: フラグなしの安定版 Chrome で HTML-in-Canvas が使えること
      how: canvas に content="drawable" を付け、canvas.content が 'drawable' を返すかを見る
      expected: true
    - id: landmarks-loaded
      what: 5 件の東京都心ランドマークが正しく読み込まれていること
      how: landmarks.length === 5 の確認
      expected: 5
    - id: popup-rendered-on-canvas
      what: Canvas ピクセル読み戻しによりポップアップ背景（白）およびボタン（青）が Canvas 内に描画されていること
      how: readPixel によるポップアップカードおよびボタン座標の RGB 値確認
      expected: isCardWhite && isBtnBlue
    - id: button-hit-where-drawn
      what: ブラウザ自身のヒットテストが、canvas に描いたボタンの位置でボタンを返し、地図の上では canvas を返すこと
      how: 描いたボタンの中心と地図の隅で document.elementFromPoint を呼ぶ
      expected: ボタンの位置は popup-btn、地図の隅は canvas
    - id: button-interactive
      what: ヒットテストで見つけた要素のクリックがボタンの処理に届き、状態変化（緑色）が Canvas ピクセルに反映されること
      how: elementFromPoint が返した要素に click() し、描き終えてから bookmarked フラグとボタンの画素を読む
      expected: map.bookmarked && isBtnGreen
    - id: button-hit-follows-pan
      what: パンした後、ヒットテストの箱がポップアップと一緒に動くこと
      how: panBy(120, 80) の後、新しいボタンの中心と元の中心で elementFromPoint を呼ぶ
      expected: 新しい位置は popup-btn、元の位置は popup-btn 以外
    - id: anchor-follows-pan
      what: 地図パン後にアンカー座標およびポップアップ描画位置がデルタ分シフトし Canvas に正しく追従すること
      how: panBy(120, 80) 前後のアンカー・矩形座標差分および移動先ピクセル値確認
      expected: dx == 120 && dy == 80 && isNewCardWhite
    - id: aerial-tile-rendered
      what: 国土地理院「全国最新写真（シームレス）」の空中写真タイルが取得され Canvas 背景に描画されていること
      how: PMTiles からのタイル読み込み完了確認
      expected: true
    - id: zoom-keeps-the-place
      what: 拡大・縮小しても地図の場所が保たれる（中心を基準に 2 段縮小すると東京タワーは中心からの距離が 1/4 になり、2 段拡大で元に戻る）
      how: getAnchorPos() を zoomBy(-2) と zoomBy(+2) の前後で読む
      expected: 予想位置との差 1.5 px 未満
