<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenStreetMap の全球ベクター地図 | map from scratch</title>
<style>
  :root { color-scheme: light; font: 14px/1.45 system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #f2f0e9; color: #243940; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #panel { position: fixed; top: 14px; left: 14px; max-width: min(420px, calc(100vw - 28px)); padding: 15px; border: 1px solid #b5c2be; border-radius: 13px; background: #ffffffea; box-shadow: 0 8px 30px #19394430; backdrop-filter: blur(10px); }
  h1 { margin: 0 0 4px; font-size: 19px; }
  p { margin: 0 0 9px; color: #546a6d; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 9px 0; }
  button { padding: 6px 10px; border: 1px solid #a9c5c2; border-radius: 7px; background: #eef7f3; color: inherit; font: inherit; cursor: pointer; }
  button:hover, button:focus-visible { background: #d1e9e3; }
  #status { font-size: 12px; color: #4a6269; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; min-height: 2.5em; }
  #credit { position: fixed; right: 12px; bottom: 10px; max-width: min(600px, calc(100vw - 24px)); padding: 6px 9px; border-radius: 6px; background: #ffffffea; font-size: 11px; }
  a { color: #086956; }
  @media(max-width:600px) { #panel { top: 8px; left: 8px; padding: 11px; max-width: calc(100vw - 16px); } }
</style>
<canvas id="map" aria-label="OpenStreetMapの全球ベクター地図"></canvas>
<section id="panel">
  <h1>OpenStreetMap の全球地図</h1>
  <p>水域・道路・地名だけを読み、簡易スタイルで描きます。</p>
  <div class="row" aria-label="場所">
    <button data-place="tokyo">東京</button><button data-place="kyoto">京都</button><button data-place="london">ロンドン</button><button data-place="newyork">ニューヨーク</button><button data-place="world">世界</button>
  </div>
  <div class="row" aria-label="拡大縮小"><button id="in">＋ 拡大</button><button id="out">－ 縮小</button></div>
  <p>ドラッグで移動、ホイールで拡大縮小</p>
  <div id="status" role="status">PMTiles の索引を読み込み中…</div>
</section>
<div id="credit">地図データ: <a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors</a> / <a href="https://openmaptiles.org/">© OpenMapTiles</a>。<a href="https://z.yuiseki.net/static/openstreetmap/planet/planet.pmtiles">元の PMTiles</a></div>
<script type="module" src="./main.js"></script>
