<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapterhorn Terrain — map-from-scratch</title>
  <meta name="description" content="A compact WebGL2 renderer for Mapterhorn Terrarium elevation tiles.">
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; color: #edf5ff; background: #07111d; }
    #view { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 52%, #263c4c 0, #142430 54%, #07111d 100%); }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
    header { position: absolute; top: clamp(20px, 4vh, 42px); left: clamp(20px, 4vw, 56px); pointer-events: none; text-shadow: 0 2px 18px #02070d; }
    .eyebrow { color: #92d8cb; font-size: 11px; font-weight: 750; letter-spacing: .2em; }
    h1 { margin: 8px 0 5px; font-size: clamp(25px, 4vw, 43px); letter-spacing: -.045em; }
    p { margin: 0; color: #b4c8d8; font-size: 13px; }
    #readout { position: absolute; right: 22px; top: 22px; padding: 10px 13px; border: 1px solid #496273; border-radius: 9px; background: #0b1822c9; color: #c7d8e5; font: 12px/1.6 ui-monospace, monospace; }
    #hint { position: absolute; left: 22px; bottom: 20px; padding: 9px 12px; border: 1px solid #496273; border-radius: 999px; background: #0b1822c9; color: #c7d8e5; font-size: 12px; }
    #credit { position: absolute; right: 22px; bottom: 20px; color: #b4c8d8; font-size: 11px; text-align: right; }
    #credit a { color: #c5e3e1; }
  </style>
  <script>window.__mfsPageStart = performance.now();</script>
</head>
<body>
  <main id="view">
    <canvas id="terrain" aria-label="3D Mapterhorn elevation terrain"></canvas>
    <header><div class="eyebrow">MAPTERHORN · TERRARIUM Z12</div><h1>Terrain in relief</h1><p>One elevation tile · 32,768 triangles · GPU hillshade</p></header>
    <div id="readout">読み込み中</div>
    <div id="hint">ドラッグで地形を回転 · ホイールでズーム</div>
    <div id="credit">標高データ: <a href="https://mapterhorn.com" target="_blank" rel="noopener">Mapterhorn</a> / 国土地理院<br>このタイルの範囲: 富士山北側 · z12</div>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
