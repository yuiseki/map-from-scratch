<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenGlobus: Base layers</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111; font-family: system-ui, sans-serif; }
    #map { width: 100%; height: 100%; display: block; cursor: grab; }
    #map:active { cursor: grabbing; }
    .panel {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(255, 255, 255, 0.94);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }
    .panel b { color: #1a2a3a; font-size: 14px; }
    .layer-switcher {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(255, 255, 255, 0.94);
      padding: 6px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      display: flex;
      gap: 4px;
      z-index: 10;
    }
    .layer-btn {
      border: 1px solid #ccc;
      background: #f7f7f7;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      color: #333;
    }
    .layer-btn.active {
      background: #1976d2;
      color: #fff;
      border-color: #1976d2;
    }
  </style>
</head>
<body>
  <canvas id="map"></canvas>
  <div class="panel">
    <div><b>OpenGlobus 002</b>: Base layers</div>
    <div style="font-size: 12px; color: #555;">Switch between OSM and Satellite styles</div>
  </div>
  <div class="layer-switcher">
    <button id="btn-osm" class="layer-btn active">OSM</button>
    <button id="btn-sat" class="layer-btn">Satellite</button>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
