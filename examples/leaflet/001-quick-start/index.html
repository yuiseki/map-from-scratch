<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leaflet: Quick Start Guide</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #aad3df; font-family: system-ui, sans-serif; }
    #map { width: 100%; height: 100%; display: block; cursor: grab; }
    #map:active { cursor: grabbing; }
    .info { position: absolute; top: 12px; left: 12px; background: rgba(255,255,255,0.92); padding: 8px 14px; border-radius: 8px; font-size: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); pointer-events: none; }
    .info b { color: #199900; }
  </style>
</head>
<body>
  <canvas id="map"></canvas>
  <div class="info">
    <b>Leaflet 001</b>: Quick Start Guide (London Marker, Circle &amp; Polygon)
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
