<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Earth — map-from-scratch</title>
  <meta name="description" content="A self-contained WebGL2 globe with an equirectangular Earth texture.">
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #030915; color: #e8f2ff; }
    #scene { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 47%, #10233b 0, #071322 42%, #030915 76%); }
    #scene::before { content: ''; position: absolute; inset: 0; opacity: .35; background-image: radial-gradient(1px 1px at 13% 18%, #fff 99%, transparent), radial-gradient(1px 1px at 79% 22%, #a9d5ff 99%, transparent), radial-gradient(1px 1px at 28% 74%, #fff 99%, transparent), radial-gradient(1.5px 1.5px at 88% 67%, #fff 99%, transparent), radial-gradient(1px 1px at 61% 86%, #bddcff 99%, transparent), radial-gradient(1px 1px at 47% 12%, #fff 99%, transparent); background-size: 310px 250px; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
    header { position: absolute; left: clamp(18px, 4vw, 56px); top: clamp(18px, 4vh, 42px); pointer-events: none; text-shadow: 0 2px 20px #000; }
    .eyebrow { color: #6ebdff; letter-spacing: .22em; font-size: 11px; font-weight: 700; }
    h1 { margin: 9px 0 4px; font-size: clamp(25px, 4vw, 44px); letter-spacing: -.045em; font-weight: 650; }
    p { margin: 0; color: #a9bdd4; font-size: 13px; }
    #hint { position: absolute; right: 22px; bottom: 20px; padding: 9px 12px; border: 1px solid #29415d; border-radius: 999px; background: #071321bb; color: #c0d0e2; font-size: 12px; }
    #credit a { color: inherit; }
    #credit { position: absolute; left: 20px; bottom: 18px; color: #7890a9; font-size: 10px; }
  </style>
  <script>window.__mfsPageStart = performance.now();</script>
</head>
<body>
  <main id="scene">
    <canvas id="earth" aria-label="Rotating 3D Earth"></canvas>
    <header><div class="eyebrow">PLANET EARTH · WEBGL2</div><h1>The Blue Planet</h1><p>One indexed sphere · one texture · GPU-lit atmosphere</p></header>
    <div id="hint">ドラッグで回転 · ホイールでズーム</div>
    <div id="credit"><a href="https://shop.solarsystemscope.com/textures/" target="_blank" rel="noopener">Earth texture: Solar System Scope · CC BY 4.0</a></div>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
