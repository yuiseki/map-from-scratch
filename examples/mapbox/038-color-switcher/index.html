<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapbox: Color Switcher</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #aad3df; font-family: system-ui, sans-serif; }
    #map { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
    #map:active { cursor: grabbing; }
    .panel {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(255, 255, 255, 0.94);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      z-index: 10;
    }
    .panel b { color: #1f3a52; font-size: 14px; }
    .row { display: flex; gap: 6px; margin-top: 8px; }
    button {
      background: #f0f0f0;
      border: 1px solid #ccc;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    button:hover { background: #e0e0e0; }
    button.active { outline: 2px solid #1f3a52; outline-offset: 1px; }
  </style>
</head>
<body>
  <canvas id="map"></canvas>
  <div class="panel">
    <div><b>Mapbox 038</b>: Color Switcher</div>
    <div class="row">
      <button id="palette-blue" data-palette="blue" style="border-left: 4px solid #aad3df;">Blue</button>
      <button id="palette-dark" data-palette="dark" style="border-left: 4px solid #14232e;">Dark</button>
      <button id="palette-sunset" data-palette="sunset" style="border-left: 4px solid #f7d9b8;">Sunset</button>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
