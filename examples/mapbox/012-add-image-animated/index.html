<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapbox: Add an image (animated)</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #aad3df; font-family: system-ui, sans-serif; }
    #map { width: 100%; height: 100%; display: block; cursor: grab; }
    #map:active { cursor: grabbing; }
    .panel {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(255, 255, 255, 0.94);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      color: #334;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      z-index: 10;
      max-width: 340px;
    }
    .panel b { color: #1f3a52; }
  </style>
</head>
<body>
  <canvas id="map"></canvas>
  <div class="panel">
    <div><b>Mapbox 012</b>: Add an image (animated)</div>
    <div>A pulsing dot at [0, 0] is redrawn every frame: the outer ring expands over one second and fades out, like Mapbox's StyleImageInterface example.</div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
