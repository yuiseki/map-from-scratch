<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapbox: Attribution position</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #aad3df; font-family: system-ui, sans-serif; }
    #map { width: 100%; height: 100%; display: block; cursor: grab; }
    #map:active { cursor: grabbing; }
    .panel {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.94);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      z-index: 10;
      text-align: center;
    }
    .panel b { color: #1f3a52; font-size: 14px; }
    .row { display: flex; gap: 6px; margin-top: 8px; justify-content: center; }
    button {
      background: #f0f0f0;
      border: 1px solid #ccc;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    button:hover { background: #e0e0e0; }
  </style>
</head>
<body>
  <canvas id="map"></canvas>
  <div class="panel">
    <div><b>Mapbox 027</b>: Attribution position</div>
    <div class="row">
      <button id="pos-bottom-left">BL</button>
      <button id="pos-bottom-right">BR</button>
      <button id="pos-top-left">TL</button>
      <button id="pos-top-right">TR</button>
    </div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
