<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapbox: Animate a line</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0f172a; font-family: system-ui, sans-serif; }
    #map { width: 100%; height: 100%; display: block; cursor: grab; }
    #map:active { cursor: grabbing; }
    .panel {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      color: #e2e8f0;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 10;
    }
    .panel b { color: #38bdf8; font-size: 14px; }
    .route-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #94a3b8;
    }
    .neon-indicator {
      width: 24px;
      height: 3px;
      background: #00e5ff;
      box-shadow: 0 0 8px #00e5ff;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <canvas id="map"></canvas>
  <div class="panel">
    <div><b>Mapbox 018</b>: Animate a line</div>
    <div class="route-info">
      <span class="neon-indicator"></span>
      <span>SF → Washington D.C. Great Circle Arc</span>
    </div>
    <div style="font-size: 11px; color: #64748b;">Streaming dynamic vertex updates @ 60 fps</div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
