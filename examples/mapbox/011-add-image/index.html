<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapbox: Add an image</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #b8d6e8; font-family: system-ui, sans-serif; }
    #map { width: 100%; height: 100%; display: block; cursor: grab; }
    #map:active { cursor: grabbing; }
    .panel {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(255, 255, 255, 0.94);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      z-index: 10;
      max-width: 340px;
    }
    .panel b { color: #1f3a52; font-size: 14px; }
  </style>
</head>
<body>
  <canvas id="map"></canvas>
  <div class="panel">
    <div><b>Mapbox 011</b>: Add an image</div>
    <div>A baked radar image is drawn between four corners over New England.</div>
    <div style="font-size: 11px; color: #667; border-top: 1px solid #ddd; padding-top: 6px;">
      Base map: © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>
      contributors, © <a href="https://openmaptiles.org/">OpenMapTiles</a> (OSM Carto via tile.yuiseki.net)
    </div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
