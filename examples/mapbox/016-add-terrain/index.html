<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapbox - Add Terrain</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #94bdde;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #info {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 6px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: #222;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="info">
    <strong>Mapbox GL JS - Add Terrain</strong><br />
    3D glacial canyon & granite monolith terrain with golden hour lighting & atmospheric haze.<br />
    Drag to rotate / pitch, scroll to zoom.
  </div>
  <canvas id="map"></canvas>
  <script type="module" src="./main.js"></script>
</body>
</html>
