<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapbox: Add a marker</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #cad2d3; font-family: system-ui, sans-serif; }
    #map { width: 100%; height: 100%; display: block; cursor: grab; }
    #map:active { cursor: grabbing; }
    .panel {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(255, 255, 255, 0.94);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 10;
    }
    .panel b { color: #1f3a52; font-size: 14px; }
    .legend { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    .legend-icon { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
  </style>
</head>
<body>
  <canvas id="map"></canvas>
  <div class="panel">
    <div><b>Mapbox 009</b>: Add a marker (Copenhagen)</div>
    <div class="legend"><span class="legend-icon" style="background:#3FB1CE"></span> Default pin [12.5547, 55.7065]</div>
    <div class="legend"><span class="legend-icon" style="background:#222"></span> Rotated 45° black pin [12.6515, 55.6082]</div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
