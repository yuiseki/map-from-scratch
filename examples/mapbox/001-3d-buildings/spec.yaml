id: mapbox-001-3d-buildings
request: >-
  Mapbox GL JS の公式サンプル「3D Buildings」のように、建物データから
  高さに基づき立ち上がる 3D 摩天楼群を押し出し生成し、夜間ダークテーマの指向性月光と発光屋根で描画したい。
  外部ライブラリなし、WebGL2 で最速・最小で実装する。

requirements:
  - id: light-footprint
    need: 外部地図エンジンを使わず軽量な配布サイズに抑える
    rationale: 3D 建物描画に巨大な Mapbox GL JS ランタイムを丸ごと読み込む必要はない
  - id: fast-startup
    need: 初回フレームが素早くレンダリングされること
    rationale: 300 ms 以内に 3D 摩天楼群が現れる
  - id: 3d-dark-night-visuals
    need: 夜間ダークテーマの中で摩天楼が発光アクセントと月光陰影で立体的に描画されること
    unmeasured: verification の checks で画面ピクセルを検証

evaluation:
  budgets:
    - {metric: code_gzip_bytes, max: 7000, unit: B, requirement: light-footprint}
    - {metric: first_frame_ms, stat: p50, max: 300, unit: ms, requirement: fast-startup}
    - {metric: frame_interval_ms, stat: p95, max: 30, unit: ms, requirement: 3d-dark-night-visuals}
  gates: [エラーがない, verification の check がすべて通る]

benchmarks:
  runtime: browser
  page: examples/mapbox/001-3d-buildings/index.html
  viewport: {width: 1024, height: 768, device_scale_factor: 1, mobile: false}
  cpu_throttle: 1
  iterations: 3
  scenarios:
    - id: first-frame
      what: 初期摩天楼メッシュの構築と初回 3D レンダリング
      metrics: [first_frame_ms]
    - id: rotate
      what: 視点回転アニメーション中のフレーム間隔
      metrics: [frame_interval_ms]

datasets:
  preparation:
    - ニューヨーク都心のグリッド都市ブロックに基づく摩天楼建築群データ（190+ 棟）をプロシージャル生成

performance_knowledge:
  - id: nighttime-extruded-mesh-batching
    finding: 摩天楼群の側壁および屋根三角形を 1 つの頂点バッファにバッチ結合し、Z-バッファ深度テストと組み合わせることで、単一のドローコールで夜景 3D 建築群を 60 fps でリアルタイム描画可能
    evidence: 1 ドローコールで Manhattan 摩天楼群を描画
    applies_when: 3D 押し出しポリゴン描画

architecture_selection:
  chosen:
    platform: browser
    api: WebGL2
    code:
      - examples/mapbox/001-3d-buildings/index.html
      - examples/mapbox/001-3d-buildings/main.ts
      - examples/mapbox/001-3d-buildings/render.ts
      - examples/mapbox/001-3d-buildings/buildings.ts
  not_doing:
    - Mapbox GL JS ライブラリ全体のバンドル

verification:
  checks:
    - id: skyscrapers-3d-rendered
      what: 画面中央部に夜間 3D 摩天楼が透視投影で描画されていること
      how: readPixels で中央ピクセルと上部夜空ピクセルを読み出し比較
      expected: 中央ピクセルが摩天楼色であり暗い夜空ピクセルと異なる
    - id: night-lighting-contrast
      what: 摩天楼発光屋根・壁面・暗夜地面の間で青色光度コントラストが存在すること
      how: readPixels で地面ピクセルと摩天楼ピクセルの青色チャンネル差を検証
      expected: 地面と摩天楼で光度コントラストが検出される
