<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapbox: Adjust a layer's opacity</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #b8d6e8; font-family: system-ui, sans-serif; }
    #map { width: 100%; height: 100%; display: block; cursor: grab; }
    #map:active { cursor: grabbing; }
    .attribution {
      position: absolute;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.9);
      padding: 3px 8px;
      border-radius: 6px 0 0 0;
      font-size: 11px;
      color: #556;
      z-index: 10;
    }
  </style>
</head>
<body>
  <canvas id="map"></canvas>
  <div class="attribution">
    Base map: © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>
    contributors, © <a href="https://openmaptiles.org/">OpenMapTiles</a> ·
    Overlay: generated checker raster (public domain)
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
